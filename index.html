<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>City Appliance Call Coach</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: dispatch-desk panel. Narrow-first (sits beside RingEX); two columns when wide.
   Left = what we know (capture, facts, diagnosis). Right = what to say (next line, quote, objections, AI, notes). */
:root{
  --bg:#eef2f5; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#15202a; --muted:#5a6773; --line:#d6dde4;
  --accent:#0d6b88; --accent-ink:#ffffff; --accent-soft:#e1f0f5;
  --warn:#9a4d07; --warn-bg:#fdf0de; --danger:#b42318; --danger-bg:#fde7e4; --ok:#17734a; --ok-bg:#e3f3ea;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#161f28; --surface-2:#1b2631; --ink:#e3eaf0; --muted:#94a3b1; --line:#2a3946;
  --accent:#53b6d6; --accent-ink:#06141a; --accent-soft:#12303b;
  --warn:#f2a54e; --warn-bg:#382816; --danger:#f47b6f; --danger-bg:#3c1916; --ok:#4fc58d; --ok-bg:#122e20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161f28; --surface-2:#1b2631; --ink:#e3eaf0; --muted:#94a3b1; --line:#2a3946;
  --accent:#53b6d6; --accent-ink:#06141a; --accent-soft:#12303b;
  --warn:#f2a54e; --warn-bg:#382816; --danger:#f47b6f; --danger-bg:#3c1916; --ok:#4fc58d; --ok-bg:#122e20; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);margin:0}
.wrap{padding-inline:16px;padding-block:0 40px;max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
 
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand h1{font-size:18px;font-weight:800;letter-spacing:.01em}
.brand span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.tabs button{border:0;background:none;padding:5px 10px;border-radius:6px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.callbar{display:flex;gap:8px;align-items:center}
.timer{font-family:var(--f-mono);font-size:13px;color:var(--muted);min-width:44px;text-align:right}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
 
/* stage rail */
.stages{display:flex;gap:4px;margin-block:12px 4px;overflow-x:auto}
.stage{flex:1 0 auto;font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding:6px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);text-align:center;white-space:nowrap}
.stage.done{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.stage.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.example-note{font-size:12px;color:var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:8px;margin-top:8px}
 
/* columns */
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;margin-top:10px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.col.right{position:sticky;top:64px}
@media (max-width:880px){
  .cols{display:flex;flex-direction:column}
  .col{display:contents}
  .col.right{position:static}
  #flags{order:0}#sayNext{order:1}#capture{order:2}#need{order:3}#facts{order:4}#diag{order:5}#quote{order:6}#objections{order:7}#ai{order:8}#notes{order:9}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .spacer{margin-left:auto}
.hint{font-size:12px;color:var(--muted)}
 
/* say next */
#sayNext{background:var(--accent-soft);border-color:transparent;position:sticky;top:64px;z-index:5}
@media (min-width:881px){#sayNext{position:static}}
#sayNext .kind{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent)}
#sayNext .line{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.25;margin:4px 0 6px}
#sayNext .why{font-size:13px;color:var(--muted)}
#sayNext.safety{background:var(--danger-bg)}
#sayNext.safety .kind{color:var(--danger)}
.say-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
 
/* flags */
.flag{border-radius:var(--r);padding:12px 14px;background:var(--danger-bg);color:var(--ink);border:1px solid var(--danger)}
.flag b{color:var(--danger);font-family:var(--f-display);font-size:15px;display:block;margin-bottom:2px}
.flag.warn{background:var(--warn-bg);border-color:var(--warn)}
.flag.warn b{color:var(--warn)}
#flags{display:flex;flex-direction:column;gap:8px}
#flags:empty{display:none}
 
/* capture */
.cap-row{display:flex;gap:6px}
.cap-row textarea{flex:1;min-width:0;resize:vertical;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2)}
.who{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap;align-items:center}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.log{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.log li{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:5px 8px;border-radius:6px;background:var(--surface-2)}
.log li .t{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:2px}
.log li .w{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--accent);padding-top:3px;min-width:52px}
.log li .w.csr{color:var(--muted)}
.log li .x{margin-left:auto;border:0;background:none;color:var(--muted);padding:0 4px}
.log li span.txt{min-width:0;overflow-wrap:anywhere}
.empty{font-size:13px;color:var(--muted);padding:8px 0}
 
/* chips + facts */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.auto.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip.off{text-decoration:line-through;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:3px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--surface-2)}
.field input.auto{border-color:var(--accent);background:var(--accent-soft)}
.field .tag{font-size:10px;color:var(--accent);margin-left:4px;text-transform:none;letter-spacing:0}
.sub{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:12px 0 6px}
.area-pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;margin-left:4px}
.area-pill.in{background:var(--ok-bg);color:var(--ok)}.area-pill.out{background:var(--danger-bg);color:var(--danger)}
 
/* need list */
.need{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.need li{display:flex;gap:10px;align-items:baseline;font-size:13px}
.need li .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;transform:translateY(-1px)}
.need li.req .dot{background:var(--warn)}
.need li.diag .dot{background:var(--accent)}
.need li.done{color:var(--muted);text-decoration:line-through}
.need li.done .dot{background:var(--ok)}
.need li .q{min-width:0}
 
/* diagnosis */
.dgroup+.dgroup{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.dgroup h3{font-size:15px;margin-bottom:8px}
.dq{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.dq:last-child{border-bottom:0}
.dq .qt{flex:1 1 220px;min-width:0;font-size:13px}
.yn{display:flex;gap:3px}
.yn button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 9px;font-size:12px}
.yn button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dhint{flex-basis:100%;font-size:12.5px;padding:6px 9px;border-radius:6px;background:var(--accent-soft)}
.tip{font-size:12.5px;margin-top:8px;padding:6px 9px;border-radius:6px;background:var(--warn-bg)}
 
/* quote */
.lane{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.lane .name{font-family:var(--f-display);font-size:17px;font-weight:700}
.lane .fee{font-family:var(--f-mono);font-size:22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:8px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.script{background:var(--surface-2);border-left:3px solid var(--accent);padding:9px 11px;border-radius:0 8px 8px 0;font-size:14px;margin-top:8px}
.script.muted{border-left-color:var(--line)}
.ex{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--warn);background:var(--warn-bg);padding:1px 6px;border-radius:4px}
 
/* objections */
.objs{display:flex;flex-wrap:wrap;gap:5px}
.objs button{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:5px 9px;font-size:12.5px;text-align:left}
.objs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
 
/* ai */
#ai textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2);resize:vertical;min-height:40px}
.ai-out{margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.ai-out ul{margin:0;padding-left:18px}
.err{color:var(--danger);font-size:13px}
 
/* notes */
#notesText{width:100%;min-height:120px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface-2);resize:vertical}
 
/* settings + plan */
.page{max-width:860px;margin:16px auto 0;display:flex;flex-direction:column;gap:14px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sgrid .wide{grid-column:1/-1}
.sgrid textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--surface-2);min-height:54px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.banner{padding:10px 12px;border-radius:8px;font-size:13px}
.banner.warn{background:var(--warn-bg);color:var(--ink)}
.banner.ok{background:var(--ok-bg)}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.flow li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.flow li:last-child{border-bottom:0}
.flow .n{font-family:var(--f-mono);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px}
.flow b{font-family:var(--f-display)}
.checklist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
table.cost{width:100%;border-collapse:collapse;font-size:13px}
table.cost td,table.cost th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.cost td:last-child,table.cost th:last-child{text-align:right;font-family:var(--f-mono)}
@media (prefers-reduced-motion:no-preference){#sayNext .line{animation:fade .25s ease}}
@keyframes fade{from{opacity:.4}to{opacity:1}}
</style>
<style>
.dq{flex-direction:column;align-items:stretch;gap:6px}
.dq .qt{flex:none;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:4px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;font-size:12.5px;text-align:left;line-height:1.3}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dq input.txt{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface-2);width:100%}
.info{font-size:12.5px;padding:7px 10px;border-radius:6px;border-left:3px solid var(--accent);background:var(--accent-soft)}
.info.red{background:var(--danger-bg);border-color:var(--danger)}
.info.amber{background:var(--warn-bg);border-color:var(--warn)}
.diy{font-size:12.5px;padding:7px 10px;border-radius:6px;background:var(--ok-bg);border-left:3px solid var(--ok)}
.diy b{color:var(--ok)}
#sayNext .opts{margin-top:8px}
#sayNext .opt{background:var(--surface)}
table.price{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
table.price td{padding:5px 2px;border-bottom:1px solid var(--line)}
table.price td:last-child{text-align:right;font-family:var(--f-mono);white-space:nowrap;padding-left:10px}
table.price tr.total td{font-weight:600;border-bottom:0}
.banned{font-size:12px;margin-top:8px;color:var(--muted)}
.banned b{color:var(--danger)}
.zone{font-size:12.5px;margin-top:6px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.pill.prem{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.calltype{display:flex;gap:4px;margin-bottom:10px}
.done-btn{margin-left:auto}
@media (max-width:880px){.cols{align-items:stretch}}
.tight{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rule{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.rule-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.rule-main b{font-family:var(--f-display);font-size:14px}
.rule-meta{display:flex;flex-wrap:wrap;gap:4px}
.rule-actions{display:flex;gap:4px;flex:none}
label.chip{cursor:pointer;user-select:none}
select.small{font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);text-transform:none;letter-spacing:0;font-weight:400}
.sgrid select{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--surface-2)}
#cf_syms:empty,#cf_when_a:empty{display:none}
</style>
 
<style>
.overlay{position:fixed;inset:0;background:var(--bg);z-index:50;display:grid;place-items:center;padding:16px}
.login{width:min(380px,100%)}
.login .field input{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface-2)}
.phone-status{font-size:12.5px;color:var(--muted);min-height:16px}
.phone-status.ok{color:var(--ok)}.phone-status.bad{color:var(--danger)}.phone-status.warn{color:var(--warn)}
.ringing,.oncall{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);display:flex;flex-direction:column;gap:8px}
.ringing{background:var(--warn-bg)}
.ringing b,.oncall b{font-family:var(--f-display);font-size:15px}
.captions{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-height:20px}
.captions .w{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--accent)}
.captions .w.csr{color:var(--muted)}
.log li.csr-line{opacity:.75}
</style>
<style>
.calls{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.callrow{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);cursor:pointer}
.callrow:hover{border-color:var(--accent)}
.callrow.sel{border-color:var(--accent);background:var(--accent-soft)}
.callrow-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.callrow-main b{font-family:var(--f-display);font-size:14px}
.call-sum{font-size:12.5px;color:var(--ink);opacity:.85}
.callrow-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;white-space:nowrap;flex:none}
@media (max-width:600px){.callrow{flex-direction:column}.callrow-meta{align-items:flex-start;white-space:normal}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ringcentral-web-phone@2.4.5/dist/index.iife.js"></script>
<script src="config.js"></script>
</head>
