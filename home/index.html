<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#161b22">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<title>City Appliance — Home</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3{margin:0;font-weight:700}
h1{font-size:18px} h2{font-size:22px}
h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.muted{color:var(--muted)} .grow{flex:1}
.top{background:var(--accent);color:var(--accent-ink);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.top .who{font-size:12px;opacity:.9}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.top button{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.stat:hover,.tile:hover{border-color:var(--accent-text)}
.stat b{font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)} .stat.good b{color:var(--good)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:3px}
.tile b{font-size:15px;color:var(--accent-text)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 12px;background:var(--sunk);white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line)}
td select{width:150px}
.card{max-width:380px;margin:9vh auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld>span{font-size:12px;color:var(--muted);font-weight:600}
.notice{background:var(--bad-bg);color:var(--bad);border-radius:var(--r);padding:9px 11px;margin:10px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);max-width:min(92vw,560px);z-index:50;font-weight:600}
#toast.bad{background:var(--bad);color:#fff}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../app.css">
</head>
<body>
<script src="../shell.js" data-base="../" data-page="home" data-bar="1"></script>
<div id="app"></div>
<div id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script src="../auth.js"></script>
<script>
/* Home: one page per role. It only reads data the signed-in person may already see (row-level security decides),
   and shows the tools that role can open. First version: Parts desk and intake numbers. */
const CFG=window.COACH_CONFIG||{};
const SB=Auth.client();
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
const daysUntil=iso=>Math.round((new Date(iso+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5);
/* Manager is an Office (csr) account with profiles.manager set, so it is offered here as its own choice. */
const ROLES=['admin','manager','csr','senior','tech','stock','pending'];
const ROLE_NAME={admin:'Admin',manager:'Manager',csr:'Office (takes calls)',senior:'Senior technician',tech:'Technician',stock:'Stock helper',pending:'Waiting for access'};
const roleKey=u=>u&&u.role==='csr'&&u.manager?'manager':u&&u.role==='tech'&&u.senior?'senior':(u&&u.role);
const S={session:null,me:null,parts:[],wos:[],intakes:[],team:[],tri:null,loading:false,err:''};
const office=()=>!!S.me&&['csr','admin'].includes(S.me.role);
const mgr=()=>!!S.me&&(S.me.role==='admin'||(S.me.role==='csr'&&!!S.me.manager));
const allowed=()=>!!S.me&&['csr','admin','tech','stock'].includes(S.me.role);

let toastTimer;
function toast(msg,bad){const t=$('toast');t.textContent=msg;t.className=bad?'bad':'';t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},bad?7000:4000)}

async function whoami(){
  S.me=await Auth.profile(S.session);
  Object.assign(S,await Auth.assurance(S.session));
}
/* Work order and call numbers come from tables that need the 6-digit code. */
const coded=()=>S.aal==='aal2';
async function load(){
  S.loading=true;render();
  const since=new Date(Date.now()-7*864e5).toISOString();
  const jobs=[S.me.role==='stock'?Promise.resolve({data:[]}):SB.from('parts').select('id,status,eta,return_by,returned_on,created_at,requested_by').limit(2000)];
  if(office()&&coded())jobs.push(SB.from('intakes').select('outcome,created_at').gte('created_at',since).limit(1000));
  const res=await Promise.all(jobs);
  S.loading=false;
  const bad=res.find(r=>r.error);S.err=bad?bad.error.message:'';
  S.parts=res[0].data||[];
  if(office()&&coded()){const w=await SB.from('work_orders').select('status,approval,invoice_sent_on,paid_on').limit(2000);S.wos=w.data||[];}
  S.intakes=office()&&coded()&&res[1]?res[1].data||[]:[];
  render();
  loadTriage();
}
/* Triage numbers: coming jobs nobody has gone through yet, and suggested parts waiting for a sign-off.
   Job data needs two-step sign-in, so without it these stay hidden and the Triage page asks for the code. */
async function loadTriage(){
  S.tri=null;
  if(!['csr','admin','tech'].includes(S.me.role))return;
  try{
    const a=await Auth.assurance(S.session);
    if(a.aal!=='aal2'){S.tri={locked:true};render();return}
    const from=new Date().toISOString(),to=new Date(Date.now()+14*864e5).toISOString();   /* only visits still ahead */
    const j=await SB.from('jobs').select('id,scheduled_start,job_number').is('deleted_at',null).is('canceled_at',null).eq('work_status','scheduled').gte('scheduled_start',from).lt('scheduled_start',to).limit(600);
    if(j.error)return;
    const [t,s,dp]=await Promise.all([SB.from('job_triage').select('job_id,status,model,parts_call').limit(2000),SB.from('job_triage_parts').select('job_id').eq('status','suggested').limit(2000),
      SB.from('parts').select('job_number').in('status',['need_to_order','ordered','backordered','shipped','received']).limit(2000)]);
    if(t.error)return;   /* triage is not switched on yet */
    const done=new Set((t.data||[]).filter(x=>x.status==='triaged').map(x=>x.job_id)),tri=new Map((t.data||[]).map(x=>[x.job_id,x])),
      /* no model number on file, visit more than 24 hours away, and not triaged as 'no parts needed': worth a call */
      noModel=x=>{const r=tri.get(x.id)||{};return !String(r.model||'').trim()&&!(r.status==='triaged'&&r.parts_call==='none')},hrs=x=>(new Date(x.scheduled_start)-Date.now())/36e5,
      /* a job with parts already on the Parts desk has been looked at, the same rule as the Triage page */
      desk=new Set(((dp&&dp.data)||[]).map(p=>String(p.job_number||'').trim()).filter(Boolean)),coming=new Set((j.data||[]).map(x=>x.id)),
      open=(j.data||[]).filter(x=>!done.has(x.id)&&!desk.has(String(x.job_number||'').trim()));
    S.tri={late:open.filter(x=>hrs(x)<=24).length,due:open.filter(x=>hrs(x)>24&&hrs(x)<=48).length,later:open.filter(x=>hrs(x)>48).length,signoff:((s&&s.data)||[]).filter(x=>coming.has(x.job_id)).length,ask:(j.data||[]).filter(x=>hrs(x)>24&&noModel(x)).length};
    render();
  }catch(e){}
}
function vTriage(){
  const T=S.tri;if(!T)return '';
  if(T.locked)return `<h3>Triage before the visit</h3><div class="grid"><a class="stat" href="../triage/"><b>Triage</b><span>Enter your sign-in code to see which jobs need triage</span></a></div>`;
  return `<h3>Triage before the visit</h3><div class="grid">
    ${stat(T.late,'Visit inside 24 hours, not triaged','bad','../triage/')}
    ${stat(T.due,'Visit inside 48 hours, not triaged','warn','../triage/')}
    ${stat(T.later,'Further out, needs triage','','../triage/')}
    ${stat(T.ask,'No model number: ask the customer','warn','../triage/')}
    ${stat(T.signoff,'Suggested parts waiting for sign-off','warn','../triage/#run')}
    <a class="stat" href="../triage/#run"><b>Parts run</b><span>Open the list before anyone drives to the parts house</span></a></div>`;
}

const stat=(n,label,tone,href)=>`<a class="stat ${n?tone||'':''}" href="${href}"><b>${n}</b><span>${label}</span></a>`;
function vAttention(){
  const P=S.parts,n=f=>P.filter(f).length,mine=p=>p.requested_by===S.me.id;
  if(office()){
    const weekJobs=S.intakes.filter(i=>i.outcome==='job').length,weekLeads=S.intakes.filter(i=>i.outcome!=='job').length;
    return vTriage()+`<h3>Needs attention</h3><div class="grid">
      ${stat(n(p=>p.status==='need_to_order'),'Parts waiting to be ordered','warn','../parts/')}
      ${stat(n(p=>['ordered','shipped'].includes(p.status)&&p.eta&&daysUntil(p.eta)<0),'Orders past their arrival date','bad','../parts/')}
      ${stat(n(p=>p.status==='backordered'),'Backordered with no ETA','bad','../parts/')}
      ${stat(n(p=>p.status==='received'),'Parts received, not yet installed','good','../tobook/#parts')}
      ${stat(n(p=>p.status==='received'&&p.return_by&&daysUntil(p.return_by)<=7),'Return windows closing within a week','warn','../parts/')}
      ${stat(n(p=>p.status==='returned'),'Returns still waiting on credit','warn','../parts/')}</div>
     ${coded()?'':`<h3>Work orders and calls</h3>${Auth.codeForm('Work order and call numbers hold customer details.','../',S.next)}`}
     ${!coded()?'':`<h3>Work orders from warranty companies and property managers</h3><div class="grid">
      ${S.wos.some(w=>w.status==='draft')?stat(S.wos.filter(w=>w.status==='draft').length,'Arrived by email, waiting for review','warn','../workorders/'):''}
      ${stat(S.wos.filter(w=>['new','contacting'].includes(w.status)).length,'Waiting to be contacted and booked','warn','../tobook/#wo')}
      ${stat(S.wos.filter(w=>['new','contacting','booked'].includes(w.status)&&['needed','requested'].includes(w.approval)).length,'Waiting on approval','warn','../workorders/')}
      ${stat(S.wos.filter(w=>w.status!=='cancelled'&&w.invoice_sent_on&&!w.paid_on).length,'Invoiced and not paid yet','warn','../workorders/')}</div>
     <h3>Calls taken in the last 7 days</h3><div class="grid">
      ${stat(weekJobs,'Booked as jobs','','../intake/')}${stat(weekLeads,'Saved as leads or incomplete','warn','../tobook/#calls')}</div>`}`;
  }
  if(S.me.role==='stock')return `<h3>Your work</h3><div class="grid"><a class="stat" href="../stock/"><b>Stock</b><span>Scan parts in, sort them, and keep the eBay list</span></a></div>`;
  return vTriage()+`<h3>Your parts</h3><div class="grid">
    ${stat(n(p=>p.status==='received'),'Parts in and ready for a job','good','../parts/')}
    ${stat(n(p=>mine(p)&&p.status==='need_to_order'),'Your requests waiting to be ordered','warn','../parts/')}
    ${stat(n(p=>mine(p)&&['ordered','backordered','shipped'].includes(p.status)),'Your requests on the way','','../parts/')}</div>`;
}
/* Team and access, the intake "Other" lists and the rest of the company settings live on the Settings page. */
function vHome(){
  const first=(S.me.display_name||'').split(' ')[0];
  return `<header class="top"><h1>${first?'Hi, '+esc(first):'Home'}</h1><span class="muted">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</span><span class="grow"></span>
    <button data-a="refresh">${S.loading?'Loading…':'Refresh'}</button></header>
  <div class="wrap">
   ${S.err?`<div class="notice">Some numbers could not be loaded: ${esc(S.err)}</div>`:''}
   ${vAttention()}
</div>`;
}
function vLogin(){return Auth.loginForm('City Appliance')}
function vWaiting(){return `<div class="card"><h2>Waiting for access</h2>
  <p>You are signed in as ${esc(S.me.email||'')}, but this account has not been given a role yet. Ask Jake to set it.</p>
  <button data-a="signout">Sign out</button></div>`}
function render(){
  if(window.AppShell)AppShell.set(S.session?S.me:null);   /* the shared menu shows what this role can open */
  $('app').innerHTML=!SB?'<div class="card"><h2>Home</h2><p>This page is missing its configuration (config.js).</p></div>'
    :!S.session?vLogin():!allowed()?vWaiting():vHome();
}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;
  if(el.dataset.a==='refresh')load();
  if(el.dataset.a==='signout'){await Auth.signOut()}});
document.addEventListener('submit',async e=>{if(e.target.id!=='login')return;e.preventDefault();
  const msg=$('lgMsg');msg.textContent='Signing in…';
  const {data,error}=await Auth.signIn($('lgEmail').value,$('lgPass').value);
  if(error){msg.textContent=error.message;return}
  S.session=data.session;await whoami();render();if(allowed())load()});
(async function boot(){
  if(!SB){render();return}
  S.session=await Auth.session(s=>{S.session=s});
  if(S.session)await whoami();
  render();if(S.session&&allowed())load();
})();
</script>
</body>
</html>
