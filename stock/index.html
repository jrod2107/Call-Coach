<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#1e40af">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<title>City Appliance — Stock</title>
<style>
:root{
  --bg:#f3f4f6; --surface:#ffffff; --sunk:#eceef1; --ink:#171a1e; --muted:#5d6670; --line:#d8dce1;
  --accent:#1e40af; --accent-ink:#ffffff; --accent-text:#1e40af; --accent-soft:#e4ebfb;
  --warn:#8a4b00; --warn-bg:#fcecd2; --good:#17623a; --good-bg:#dcf1e3; --bad:#9c241c; --bad-bg:#fae1de; --info:#1e40af; --info-bg:#e4ebfb;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; --r:6px;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#111315; --surface:#1a1d21; --sunk:#22262b; --ink:#e8eaed; --muted:#9aa3ad; --line:#2f353c;
  --accent:#2f5fd0; --accent-ink:#ffffff; --accent-text:#8fb0ff; --accent-soft:#1a2748;
  --warn:#f0b962; --warn-bg:#3a2c12; --good:#80d4a2; --good-bg:#14311f; --bad:#f39c94; --bad-bg:#3c1a17; --info:#8fb0ff; --info-bg:#1a2748;
  color-scheme:dark } }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3{margin:0;font-weight:700}
h1{font-size:18px} h2{font-size:16px} h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-size:13px} .muted{color:var(--muted)} .num{text-align:right;font-variant-numeric:tabular-nums}
.grow{flex:1}
.top{background:var(--accent);color:var(--accent-ink);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.top .who{font-size:12px;opacity:.9}
.top a{color:inherit;text-decoration:none;opacity:.9}
.wrap{max-width:1280px;margin:0 auto;padding:14px 16px 60px}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:7px 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent-text)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.small{padding:4px 9px;font-size:13px}
button.big{padding:12px 16px;font-size:16px}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.top button{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.top button.primary{background:#fff;color:var(--accent)}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
textarea{min-height:56px;resize:vertical}
.top input,.top select{max-width:260px;background:#fff;color:#171a1e;border-color:transparent}
.top select{max-width:170px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:4px 0 14px}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted);padding:9px 12px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent-text)}
.tabs .n{font-size:12px;padding:0 6px;border-radius:99px;background:var(--sunk);color:var(--ink);font-variant-numeric:tabular-nums}
.tabs .n.hot{background:var(--warn-bg);color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 12px;background:var(--sunk);white-space:nowrap}
th.num{text-align:right}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr[data-a]{cursor:pointer} tbody tr[data-a]:hover{background:var(--sunk)}
td .mono{white-space:nowrap}
td.act{white-space:nowrap;text-align:right}
td.act input{width:86px;display:inline-block}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.empty{padding:22px;color:var(--muted);text-align:center}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:9px 11px}
.notice.bad{background:var(--bad-bg);color:var(--bad)} .notice.good{background:var(--good-bg);color:var(--good)} .notice.info{background:var(--info-bg);color:var(--info)}
.card{max-width:380px;margin:9vh auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);font-weight:600}
.fld.wide{grid-column:1/-1}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sum{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 12px;color:var(--muted)} .sum b{color:var(--ink)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(760px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.dbody{padding:16px;display:flex;flex-direction:column;gap:14px}
.dfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.hist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
#reader{width:100%;max-width:520px;margin:0 auto;border-radius:var(--r);overflow:hidden;background:#000}
/* The scanner measures this box when it starts, so it must never be display:none or zero wide. */
#reader video{width:100%!important;height:auto!important;display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);max-width:min(92vw,560px);z-index:50;font-weight:600}
#toast.bad{background:var(--bad);color:#fff}
#print{display:none}
@media (max-width:640px){ input,select,textarea{font-size:16px} .wrap{padding:10px 10px 60px} td,th{padding:8px} }
@media print{
  @page{size:2.25in 1.25in;margin:0}
  body{background:#fff} body>*:not(#print){display:none!important}
  #print{display:block}
  .label{width:2.25in;height:1.25in;padding:.06in .08in;color:#000;font:8pt/1.15 Arial,Helvetica,sans-serif;display:flex;flex-direction:column;overflow:hidden;page-break-after:always}
  .label .l1{display:flex;justify-content:space-between;font-weight:700;font-size:10pt}
  .label .l2{font-family:Menlo,Consolas,monospace;font-size:9pt;font-weight:700}
  .label svg{width:100%;height:.36in;margin:.02in 0}
  .label .l4{font-size:7pt}
}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="print"></div>
<div id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="../config.js"></script>
<script>
/* Stock v1. Tables: stock_items (one row per physical part), stock_catalog, stock_plan, stock_locations, stock_events
   (see supabase/migrations/*stock_v1.sql).
   Four numbers per part number and location:
     on hand = in stock + held;  held = set aside for a job;  available = in stock (the only ones anyone can pull);
     on order = already on a purchase list.  Restock need = minimum - (available + on order).
   The database enforces who may change what; this page only hides what a role cannot do. */
const CFG=window.COACH_CONFIG||{};
const SB=(window.supabase&&CFG.supabaseUrl)?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey):null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n==null||n===''?'':'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toLocaleDateString('en-CA');
const fmtDate=iso=>iso?new Date(String(iso).slice(0,10)+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
const numOrNull=v=>{v=String(v==null?'':v).trim();if(v==='')return null;const n=Number(v);return isFinite(n)&&n>=0?n:null};
const sum=(a,f)=>a.reduce((t,x)=>t+(Number(f(x))||0),0);

const ACTIVE=['in_stock','held'];
const PURPOSE={keep:'Keep in stock',ebay:'Sell on eBay',undecided:'Not decided'};
const COND={new:'New',open_box:'Open box',used:'Used'};
const STATUS={in_stock:'In stock',held:'Held',used:'Used on a job',sold:'Sold',removed:'Removed'};
const TABS=[['stock','In stock'],['undecided','Not decided'],['ebay','eBay'],['restock','Restock'],['history','History']];
const S={session:null,me:null,items:[],hist:[],cat:{},plan:[],locs:[],tab:'stock',q:'',loc:'',loading:false,err:'',dlg:null,scan:null,events:[],cam:null};
const office=()=>!!S.me&&['csr','admin'].includes(S.me.role);
const mgr=()=>!!S.me&&(S.me.role==='admin'||(S.me.role==='csr'&&!!S.me.manager));
const editor=()=>!!S.me&&['csr','admin','stock'].includes(S.me.role);   /* may change what a part is, its cost and its eBay details */
const allowed=()=>!!S.me&&['csr','admin','tech','stock'].includes(S.me.role);
const item=id=>S.items.find(i=>i.id===id)||S.hist.find(i=>i.id===id);
const locName=id=>(S.locs.find(l=>l.id===id)||{}).name||'';
const catOf=pn=>S.cat[pn]||{part_number:pn,description:'',brand:''};
const pill=(l,t)=>`<span class="pill ${t||''}">${esc(l)}</span>`;
const opts=(map,cur)=>Object.entries(map).map(([k,l])=>`<option value="${k}" ${cur===k?'selected':''}>${esc(l)}</option>`).join('');
const locOpts=cur=>S.locs.filter(l=>l.active||l.id===cur).map(l=>`<option value="${l.id}" ${cur===l.id?'selected':''}>${esc(l.name)}</option>`).join('');

let toastTimer;
function toast(msg,bad){const t=$('toast');t.textContent=msg;t.className=bad?'bad':'';t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},bad?7000:4200)}

/* ---------- data ---------- */
async function whoami(){
  const {data}=await SB.from('profiles').select('display_name,email,role,manager').eq('id',S.session.user.id).maybeSingle();
  S.me=data||{role:'pending',email:S.session.user.email,display_name:''};
}
/* The API returns at most 1000 rows per request, so read in pages until a short page comes back. */
async function all(table,build){
  const out=[];
  for(let from=0;;from+=1000){const {data,error}=await build(SB.from(table)).range(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)break}
  return out;
}
const one=async q=>{const {data,error}=await q;if(error)throw error;return data||[]};
async function load(){
  S.loading=true;render();
  try{
    const [items,hist,cat,plan,locs]=await Promise.all([
      all('stock_items',q=>q.select('*').in('status',ACTIVE).order('created_at',{ascending:false}).order('id')),
      one(SB.from('stock_items').select('*').in('status',['used','sold','removed']).order('updated_at',{ascending:false}).limit(300)),
      all('stock_catalog',q=>q.select('*').order('part_number')),
      all('stock_plan',q=>q.select('*').order('part_number').order('location_id')),
      one(SB.from('stock_locations').select('*').order('name'))]);
    S.items=items;S.hist=hist;S.plan=plan;S.locs=locs;S.cat=Object.fromEntries(cat.map(c=>[c.part_number,c]));S.err='';
  }catch(e){S.err=e.message||String(e)}
  S.loading=false;render();if(S.dlg)renderDlg();
}
/* Change one part, but only if it is still in the state we think it is. If someone else got there first, nothing is
   changed and the list reloads. This is what stops two people taking the same part. */
async function updItem(id,from,patch,msg){
  const {data,error}=await SB.from('stock_items').update(patch).eq('id',id).in('status',from).select('id');
  if(error){toast(error.message,true);return false}
  if(!data.length){toast('Someone else just changed that part. The list has been refreshed.',true);await load();return false}
  if(msg)toast(msg);await load();return true;
}

/* ---------- the four numbers ---------- */
const locOK=x=>!S.loc||x.location_id===S.loc;
const planFor=(pn,loc)=>S.plan.filter(p=>p.part_number===pn&&(!loc||p.location_id===loc));
function restockRows(){
  return S.plan.filter(locOK).map(p=>{
    const here=S.items.filter(i=>i.part_number===p.part_number&&i.location_id===p.location_id&&i.purpose==='keep');
    const avail=here.filter(i=>i.status==='in_stock').length,held=here.filter(i=>i.status==='held').length;
    return {pn:p.part_number,loc:p.location_id,min:p.min_qty,on_order:p.on_order,avail,held,need:Math.max(0,p.min_qty-avail-p.on_order)};
  });
}
function groups(filter){
  const q=S.q.trim().toLowerCase(),m=new Map();
  for(const i of S.items){
    if(!filter(i)||!locOK(i))continue;
    if(q){const c=catOf(i.part_number);if(![i.part_number,c.description,c.brand,i.tag,i.bin,i.held_job,i.held_by_name].join(' ').toLowerCase().includes(q))continue}
    let g=m.get(i.part_number);if(!g){g={pn:i.part_number,units:[]};m.set(i.part_number,g)}g.units.push(i);
  }
  return [...m.values()].sort((a,b)=>a.pn.localeCompare(b.pn));
}
const ebayStage=i=>i.status==='sold'?'Sold':i.ebay_listed_on?'Listed':'To list';

/* ---------- views ---------- */
function vLogin(){return `<form class="card" id="login"><h2>City Appliance Stock</h2>
  <p class="muted">Sign in with the email and password you were given.</p>
  <label class="fld"><span>Email</span><input id="lgEmail" type="email" autocomplete="username" required></label>
  <label class="fld"><span>Password</span><input id="lgPass" type="password" autocomplete="current-password" required></label>
  <button class="primary" type="submit">Sign in</button><div id="lgMsg" class="muted" role="status"></div></form>`}
function vWaiting(){return `<div class="card"><h2>Waiting for access</h2>
  <p>You are signed in as ${esc(S.me.email||'')}, but this account has not been given access to Stock yet. Ask Jake to set your role.</p>
  <button data-a="signout">Sign out</button></div>`}

function partCell(pn){const c=catOf(pn);return `<span class="mono">${esc(pn)}</span><br><span class="muted">${esc([c.brand,c.description].filter(Boolean).join(' · ')||'No name yet')}</span>`}
function tStock(){
  const gs=groups(i=>i.purpose==='keep'),need=new Map();
  for(const r of restockRows())if(r.need)need.set(r.pn,(need.get(r.pn)||0)+r.need);
  if(!gs.length)return `<div class="empty">${S.loading?'Loading…':S.q?'Nothing here matches your search.':'No parts marked "Keep in stock" yet. Scan parts in, then mark the ones to keep.'}</div>`;
  return `<div class="scroll"><table><thead><tr><th>Part</th><th class="num">On hand</th><th class="num">Held</th><th class="num">Available</th><th class="num">On order</th><th class="num">Minimum</th><th>Where</th></tr></thead><tbody>
   ${gs.map(g=>{const held=g.units.filter(u=>u.status==='held'),pl=planFor(g.pn,S.loc),where=[...new Set(g.units.map(u=>locName(u.location_id)+(u.bin?' '+u.bin:'')))];
     return `<tr data-a="open" data-pn="${esc(g.pn)}"><td>${partCell(g.pn)}</td><td class="num">${g.units.length}</td>
      <td class="num">${held.length?`${held.length}<br><span class="muted">${esc([...new Set(held.map(u=>'#'+u.held_job))].join(', '))}</span>`:'0'}</td>
      <td class="num"><b>${g.units.length-held.length}</b></td><td class="num">${sum(pl,p=>p.on_order)}</td><td class="num">${sum(pl,p=>p.min_qty)||'<span class="muted">—</span>'}</td>
      <td>${esc(where.slice(0,3).join(', '))}${where.length>3?' …':''} ${need.get(g.pn)?pill('Reorder '+need.get(g.pn),'warn'):''}</td></tr>`}).join('')}</tbody></table></div>`;
}
function tUndecided(){
  const gs=groups(i=>i.purpose==='undecided');
  if(!gs.length)return `<div class="empty">${S.loading?'Loading…':'Nothing waiting to be sorted.'}</div>`;
  return `<div class="scroll"><table><thead><tr><th>Part</th><th class="num">Count</th><th>Where</th><th></th></tr></thead><tbody>
   ${gs.map(g=>`<tr data-a="open" data-pn="${esc(g.pn)}"><td>${partCell(g.pn)}</td><td class="num">${g.units.length}</td>
     <td>${esc([...new Set(g.units.map(u=>locName(u.location_id)))].join(', '))}</td>
     <td class="act">${editor()?`<button class="small primary" data-a="bulk" data-p="keep" data-pn="${esc(g.pn)}">Keep in stock</button> <button class="small" data-a="bulk" data-p="ebay" data-pn="${esc(g.pn)}">Sell on eBay</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;
}
function tEbay(){
  const q=S.q.trim().toLowerCase();
  const rows=[...S.items,...S.hist.filter(i=>i.status==='sold')].filter(i=>i.purpose==='ebay'&&i.status!=='held'&&locOK(i)&&
    (!q||[i.part_number,catOf(i.part_number).description,catOf(i.part_number).brand,i.tag].join(' ').toLowerCase().includes(q)));
  const sold=rows.filter(i=>i.status==='sold'),listed=rows.filter(i=>i.status!=='sold'&&i.ebay_listed_on),tolist=rows.filter(i=>i.status!=='sold'&&!i.ebay_listed_on);
  const head=`<div class="sum" style="padding:12px 12px 0"><span><b>${tolist.length}</b> to list</span><span><b>${listed.length}</b> listed, asking <b>${money(sum(listed,i=>i.ebay_price))||'$0.00'}</b></span>
    <span><b>${sold.length}</b> sold for <b>${money(sum(sold,i=>i.sold_price))||'$0.00'}</b>${editor()?`, cost ${money(sum(sold,i=>i.cost))||'$0.00'}`:''}</span></div>`;
  if(!rows.length)return head+`<div class="empty">${S.loading?'Loading…':'Nothing marked for eBay yet.'}</div>`;
  const order={'To list':0,'Listed':1,'Sold':2};rows.sort((a,b)=>order[ebayStage(a)]-order[ebayStage(b)]||a.part_number.localeCompare(b.part_number));
  return head+`<div class="scroll"><table><thead><tr><th>Tag</th><th>Part</th><th>Condition</th><th>Stage</th><th class="num">${editor()?'Cost':''}</th><th class="num">Price</th><th></th></tr></thead><tbody>
   ${rows.map(i=>{const st=ebayStage(i);return `<tr data-a="open" data-pn="${esc(i.part_number)}" data-unit="${i.id}"><td class="mono">${esc(i.tag)}</td><td>${partCell(i.part_number)}</td><td>${esc(COND[i.condition])}</td>
     <td>${pill(st,st==='Sold'?'good':st==='Listed'?'info':'warn')}${st==='Sold'?`<br><span class="muted">${fmtDate(i.sold_on)}</span>`:''}</td>
     <td class="num">${editor()?money(i.cost):''}</td><td class="num">${money(st==='Sold'?i.sold_price:i.ebay_price)}</td>
     <td class="act">${!editor()||st==='Sold'?'':st==='To list'?`<input type="number" step="0.01" min="0" inputmode="decimal" id="ep-${i.id}" placeholder="Asking $" aria-label="Asking price"> <button class="small primary" data-a="list" data-id="${i.id}">Listed</button>`
       :`<input type="number" step="0.01" min="0" inputmode="decimal" id="sp-${i.id}" value="${esc(i.ebay_price)}" aria-label="Sold price"> <button class="small primary" data-a="sold" data-id="${i.id}">Sold</button>`}</td></tr>`}).join('')}</tbody></table></div>`;
}
function tRestock(){
  const q=S.q.trim().toLowerCase(),hit=r=>!q||[r.pn,catOf(r.pn).description,catOf(r.pn).brand].join(' ').toLowerCase().includes(q);
  const rows=restockRows().filter(hit),need=rows.filter(r=>r.need),onorder=rows.filter(r=>r.on_order);
  const tbl=(list,ordering)=>`<div class="scroll"><table><thead><tr><th>Part</th><th>Location</th><th class="num">Minimum</th><th class="num">Available</th><th class="num">Held</th><th class="num">On order</th>${ordering?'<th class="num">To order</th><th></th>':'<th></th>'}</tr></thead><tbody>
    ${list.map(r=>`<tr data-a="open" data-pn="${esc(r.pn)}"><td>${partCell(r.pn)}</td><td>${esc(locName(r.loc))}</td><td class="num">${r.min}</td><td class="num">${r.avail}</td><td class="num">${r.held}</td><td class="num">${r.on_order}</td>
      ${ordering?`<td class="num"><b>${r.need}</b></td><td class="act">${office()?`<button class="small primary" data-a="ordered" data-pn="${esc(r.pn)}" data-loc="${r.loc}" data-n="${r.need}">Mark ${r.need} ordered</button>`:''}</td>`

/* ---------- receive an invoice (office only) ----------
   A photo or PDF of a parts-house invoice is read by the invoice-read function, which only returns the lines.
   Each line is matched to an open job part on the Parts desk by part number. A match is received for that job;
   anything else must be sent to Stock or skipped by the person reviewing. Nothing is saved until they confirm. */
const OPEN_PART=['need_to_order','ordered','backordered','shipped'];
const normPn=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};
function invCands(line){
  const v=S.inv,key=normPn(line.pn);if(!key)return[];
  const refs=[v.head.order_number,v.head.po_number].map(normPn).filter(Boolean),ref=String(line.ref||'');
  const score=p=>(p.job_number&&ref.includes(p.job_number)?4:0)+([p.vendor_order_no,p.po_number].map(normPn).some(x=>x&&refs.includes(x))?2:0)+(p.status==='need_to_order'?0:1);
  return v.open.filter(p=>normPn(p.part_number)===key).sort((a,b)=>score(b)-score(a)||String(a.created_at).localeCompare(String(b.created_at)));
}
function invAssign(){
  const taken=new Set();
  for(const l of S.inv.lines){
    l.cands=invCands(l);
    if(l.dest&&l.dest.startsWith('part:')&&!l.cands.some(p=>'part:'+p.id===l.dest))l.dest='';
    /* Already received (by hand or from an earlier scan): say so and skip it, so it is not added to stock by mistake. */
    const key=normPn(l.pn),ref=String(l.ref||'');
    l.done=l.cands.length||!key?null:S.inv.done.filter(p=>normPn(p.part_number)===key).sort((a,b)=>(ref.includes(b.job_number)?1:0)-(ref.includes(a.job_number)?1:0)||String(b.received_on).localeCompare(String(a.received_on)))[0]||null;
    if(!l.dest&&!l.touched){const p=l.cands.find(p=>!taken.has(p.id));l.dest=p?'part:'+p.id:l.done?'skip':/\bstock\b/i.test(l.ref||'')?'stock':''}
    if(l.dest.startsWith('part:'))taken.add(l.dest.slice(5));
  }
}
function fileToPart(file){
  return new Promise((res,rej)=>{
    if(file.type==='application/pdf'){
      if(file.size>9e6){rej(new Error(file.name+' is too large. Use a PDF under 9 MB.'));return}
      const fr=new FileReader();fr.onload=()=>res({media_type:'application/pdf',data:String(fr.result).split(',')[1]});fr.onerror=()=>rej(new Error('Could not read '+file.name));fr.readAsDataURL(file);return}
    if(!/^image\//.test(file.type)){rej(new Error(file.name+' is not a photo or a PDF.'));return}
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const k=Math.min(1,2200/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res({media_type:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]})};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not open '+file.name+'. Try a JPEG or PNG photo.'))};img.src=url;
  });
}
async function invRead(){
  const v=S.inv;if(!v.files.length){toast('Add a photo or PDF of the invoice first.',true);return}
  v.step='reading';v.err='';renderDlg();
  try{
    const files=await Promise.all(v.files.slice(0,6).map(fileToPart));
    const {data:{session}}=await SB.auth.getSession();if(!session)throw new Error('Your sign-in expired. Reload the page.');
    const [r,open,done]=await Promise.all([
      fetch(CFG.supabaseUrl+'/functions/v1/invoice-read',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token,apikey:CFG.supabaseAnonKey},body:JSON.stringify({files})}),
      one(SB.from('parts').select('id,tag,job_number,customer_name,part_number,description,qty,status,cost,notes,po_number,vendor_order_no,created_at,vendors(name,return_days)').in('status',OPEN_PART).limit(1000)),
      one(SB.from('parts').select('id,tag,job_number,part_number,status,received_on,location_id').in('status',['received','installed']).gte('received_on',addDays(today(),-60)).limit(1000))]);
    const j=await r.json().catch(()=>null);
    if(!r.ok||!j||!j.data)throw new Error(j&&j.error||'The invoice could not be read.');
    if(j.data.error||!Array.isArray(j.data.lines)||!j.data.lines.length)throw new Error('No part lines were found. Check that the photo shows the whole invoice and is in focus.');
    const d=j.data,str=x=>String(x==null?'':x).trim();
    v.head={vendor:str(d.vendor),invoice_number:str(d.invoice_number),order_number:str(d.order_number),po_number:str(d.po_number)};
    v.open=open;v.done=done;
    v.lines=d.lines.map(l=>({pn:str(l.part_number).toUpperCase().replace(/\s+/g,''),desc:str(l.description),qty:Math.max(0,parseInt(l.qty_shipped,10)||0),bo:Math.max(0,parseInt(l.qty_backordered,10)||0),
      cost:l.unit_cost==null||l.unit_cost===''?'':String(l.unit_cost),ref:str(l.line_ref),unsure:!!l.unsure,dest:'',cands:[]}));
    v.lines.forEach(l=>{if(!l.qty)l.dest='skip'});
    if(!v.jobLoc)v.jobLoc=v.loc;
    invAssign();
    v.dup='';const no=v.head.invoice_number.replace(/[^A-Za-z0-9\-]/g,'');
    if(no){const [a,b]=await Promise.all([one(SB.from('stock_items').select('id').ilike('notes','%Invoice '+no+'%').limit(1)),one(SB.from('parts').select('id').ilike('notes','%invoice '+no+'%').limit(1))]);
      if(a.length||b.length)v.dup='Invoice '+no+' looks like it was already received. Check before saving it again.'}
    v.step='review';
  }catch(e){v.step='pick';v.err=e.message||String(e)}
  renderDlg();
}
async function invSave(){
  const v=S.inv,bad=v.lines.find(l=>!l.dest||(l.dest!=='skip'&&(!normPn(l.pn)||!(parseInt(l.qty,10)>0))));
  if(bad){toast(!bad.dest?'Choose where every line goes: a job, Stock or Skip.':'Every line being received needs a part number and a quantity.',true);return}
  const dests=v.lines.map(l=>l.dest).filter(d=>d.startsWith('part:'));
  if(new Set(dests).size!==dests.length){toast('Two lines are set to the same job part. Change one of them.',true);return}
  if(!v.loc){toast('Pick the location stock goes to.',true);return}
  v.step='saving';renderDlg();
  const inv=v.head.invoice_number,tagNote='Invoice '+(inv||'(no number)')+(v.head.vendor?' from '+v.head.vendor:''),res={jobs:[],stock:[],fail:[]};
  const toStock=async(l,n)=>{
    const pn=l.pn.trim().toUpperCase();
    let {error}=await SB.from('stock_catalog').upsert({part_number:pn,description:l.desc,brand:''},{onConflict:'part_number',ignoreDuplicates:true});
    if(!error){const keep=/\bstock\b/i.test(l.ref||'')||S.plan.some(p=>p.part_number===pn);
      const r=await SB.from('stock_items').insert(Array.from({length:n},()=>({part_number:pn,location_id:v.loc,purpose:keep?'keep':'undecided',condition:'new',cost:numOrNull(l.cost),vendor:v.head.vendor||null,notes:tagNote}))).select('*');
      error=r.error;if(r.data)res.stock.push(...r.data)}
    if(error)res.fail.push(pn+': '+error.message);
  };
  for(const l of v.lines){
    if(l.dest==='skip')continue;
    const qty=Math.min(200,parseInt(l.qty,10));
    if(l.dest==='stock'){await toStock(l,qty);continue}
    const p=v.open.find(x=>'part:'+x.id===l.dest),rd=p.vendors&&p.vendors.return_days;
    const patch={status:'received',received_on:today(),location_id:v.jobLoc||null,return_by:rd!=null?addDays(today(),rd):null,notes:[p.notes,'Received on i'+tagNote.slice(1)+'.'].filter(Boolean).join('\n')};
    if(p.cost==null&&numOrNull(l.cost)!=null)patch.cost=numOrNull(l.cost);
    const {data,error}=await SB.from('parts').update(patch).eq('id',p.id).in('status',OPEN_PART).select('id');
    if(error||!data.length){res.fail.push(p.tag+': '+(error?error.message:'someone already changed this part, so it was left alone'));continue}
    res.jobs.push(p);
    if(qty>p.qty)await toStock(l,qty-p.qty);
  }
  v.result=res;v.step='done';renderDlg();load();
}

/* ---------- camera ---------- */
async function camStart(){
  if(!window.Html5Qrcode){toast('The barcode scanner did not load. Check the connection and reload, or type the part number.',true);return}
  const F=window.Html5QrcodeSupportedFormats,fm=['CODE_128','CODE_39','CODE_93','EAN_13','EAN_8','UPC_A','UPC_E','ITF','QR_CODE','DATA_MATRIX'].map(k=>F[k]).filter(v=>v!=null);
  try{
    S.cam=new window.Html5Qrcode('reader',{formatsToSupport:fm,experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
    await S.cam.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.floor(w*.92),height:Math.max(70,Math.floor(h*.5))})},onScan,()=>{});
    S.scan.cam=true;S.scan.paused=false;
  }catch(e){S.cam=null;if(S.scan)S.scan.cam=false;toast('Could not open the camera. Allow camera access for this page, or type the part number. ('+(e&&e.message||e)+')',true)}
  if(S.dlg&&S.dlg.type==='scan')renderDlg();
}
async function camStop(){
  if(S.cam){try{await S.cam.stop()}catch(e){}try{S.cam.clear()}catch(e){}S.cam=null}
  if(S.scan){S.scan.cam=false;S.scan.paused=false}
}
function camPause(){if(S.cam&&S.scan&&!S.scan.paused){S.scan.paused=true;try{S.cam.pause(true)}catch(e){}}}
function camResume(){if(S.cam&&S.scan&&S.scan.paused){S.scan.paused=false;try{S.cam.resume()}catch(e){}}}
function onScan(text){
  if(!S.scan||S.scan.paused)return;
  const code=String(text||'').trim().toUpperCase();if(!code)return;
  camPause();try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  if(/^S\d{5,}$/.test(code)){const u=[...S.items,...S.hist].find(i=>i.tag===code);if(u){openUnit(u.id);return}toast('Tag '+code+' was not found in stock.',true);renderDlg();return}
  if(/^P\d{5,}$/.test(code)){toast(code+' is a Parts desk tag for a job part, not a stock part number.',true);renderDlg();return}
  setScanPn(code);renderDlg();
}
function setScanPn(v){
  const s=S.scan;s.pn=v;const c=S.cat[String(v).trim().toUpperCase()];
  if(c){s.description=c.description;s.brand=c.brand;s.known=true}else if(s.known){s.description='';s.brand='';s.known=false}
}

function pickOne(pn){

/* Tells the person when using this part drops the location below its minimum. */
function restockNote(u){
  if(u.purpose!=='keep')return'';
  const p=planFor(u.part_number,u.location_id)[0];if(!p||!p.min_qty)return'';
  const avail=S.items.filter(i=>i.part_number===u.part_number&&i.location_id===u.location_id&&i.purpose==='keep'&&i.status==='in_stock'&&i.id!==u.id).length;
  return avail+p.on_order<p.min_qty?' It is now on the Restock list.':'';
}

    if(el.dataset.inv){const [i,k]=el.dataset.inv.split(':'),l=S.inv.lines[i];if(!l)return;
      if(k==='dest'){l.dest=el.value;l.touched=true}
      if(k==='pn'){l.pn=el.value.trim().toUpperCase();l.unsure=false;if(l.dest.startsWith('part:'))l.dest='';invAssign()}
      renderDlg();return}
  }
  if(el.dataset.scan==='pn'&&S.scan){setScanPn(el.value.trim().toUpperCase());renderDlg();return}
  if(el.dataset.plan){const k=el.dataset.k,val=Math.max(0,parseInt(el.value,10)||0),pn=el.dataset.plan,loc=el.dataset.loc,cur=planFor(pn,loc)[0]||{min_qty:0,on_order:0};
    const row={part_number:pn,location_id:loc,min_qty:cur.min_qty,on_order:cur.on_order,[k]:val};
    const {error}=await SB.from('stock_plan').upsert(row,{onConflict:'part_number,location_id'});
    if(error){toast(error.message,true);return}
    const i=S.plan.findIndex(p=>p.part_number===pn&&p.location_id===loc);if(i>=0)S.plan[i]=row;else S.plan.push(row);
    toast(k==='min_qty'?`Minimum for ${pn} at ${locName(loc)} is now ${val}.`:`On order for ${pn} at ${locName(loc)} is now ${val}.`);render();return}
  if(el.dataset.locactive){const {error}=await SB.from('stock_locations').update({active:el.checked}).eq('id',el.dataset.locactive);
    if(error){toast(error.message,true);el.checked=!el.checked;return}const l=S.locs.find(x=>x.id===el.dataset.locactive);if(l)l.active=el.checked;toast('Saved.');render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sc-pn'){e.preventDefault();setScanPn(e.target.value.trim().toUpperCase());renderDlg();const n=$('sc-description');if(n)n.focus()}});
document.addEventListener('submit',async e=>{if(e.target.id!=='login')return;e.preventDefault();
  const msg=$('lgMsg');msg.textContent='Signing in…';
  const {data,error}=await SB.auth.signInWithPassword({email:$('lgEmail').value.trim(),password:$('lgPass').value});
  if(error){msg.textContent=error.message;return}
  S.session=data.session;await whoami();render();if(allowed())load()});
$('dlg').addEventListener('close',()=>{camStop();S.dlg=null;S.scan=null;S.inv=null});
window.addEventListener('focus',()=>{if(S.session&&allowed()&&!S.dlg&&!S.loading)load()});

function render(){
  $('app').innerHTML=!SB?'<div class="card"><h2>Stock</h2><p>This page is missing its configuration (config.js).</p></div>'
    :!S.session?vLogin():!allowed()?vWaiting():vMain();
}
(async function boot(){
  if(!SB){render();return}
  const {data:{session}}=await SB.auth.getSession();S.session=session;
  SB.auth.onAuthStateChange((ev,s)=>{if(s)S.session=s});
  if(session)await whoami();
  render();if(S.session&&allowed())load();
})();
</script>
</body>
</html>
