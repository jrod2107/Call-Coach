<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#161b22">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">

<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<title>City Appliance — Job pricing</title>
<style>
:root{
  --bg:#f3f4f6; --surface:#ffffff; --sunk:#eceef1; --ink:#171a1e; --muted:#5d6670; --line:#d8dce1;
  --accent:#1e40af; --accent-ink:#ffffff; --accent-text:#1e40af; --accent-soft:#e4ebfb;
  --warn:#8a4b00; --warn-bg:#fcecd2; --good:#17623a; --good-bg:#dcf1e3; --bad:#9c241c; --bad-bg:#fae1de; --info:#1e40af; --info-bg:#e4ebfb;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; --r:6px;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#111315; --surface:#1a1d21; --sunk:#22262b; --ink:#e8eaed; --muted:#9aa3ad; --line:#2f353c;
  --accent:#2f5fd0; --accent-ink:#ffffff; --accent-text:#8fb0ff; --accent-soft:#1a2748;
  --warn:#f0b962; --warn-bg:#3a2c12; --good:#80d4a2; --good-bg:#14311f; --bad:#f39c94; --bad-bg:#3c1a17; --info:#8fb0ff; --info-bg:#1a2748;
  color-scheme:dark } }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3{margin:0;font-weight:700}
h1{font-size:18px} h2{font-size:16px} h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.mono{font-family:var(--mono);font-size:13px} .muted{color:var(--muted)} .num{text-align:right;font-variant-numeric:tabular-nums}
.grow{flex:1}
.top{background:var(--accent);color:var(--accent-ink);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.top .who{font-size:12px;opacity:.9}
.top a{color:inherit;text-decoration:none;opacity:.9}
.wrap{max-width:860px;margin:0 auto;padding:14px 16px 80px;display:flex;flex-direction:column;gap:14px}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:10px 14px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--accent-text)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.small{padding:6px 10px;min-height:36px;font-size:13px}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button:disabled{opacity:.6;cursor:default}
.top button{background:rgba(255,255,255,.14);border-color:transparent;color:#fff;min-height:36px;padding:6px 12px}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;width:100%;min-width:0;min-height:44px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:9px 11px}
.notice.bad{background:var(--bad-bg);color:var(--bad)} .notice.info{background:var(--info-bg);color:var(--info)}
.card{max-width:380px;margin:9vh auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* Choice buttons: appliance class and labor level. The chosen one is marked with a border, a tick and the word "Chosen". */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.choice{text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px}
.choice b{font-size:15px} .choice span{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.choice[aria-pressed="true"]{border:2px solid var(--accent-text);background:var(--accent-soft)}
.choice[aria-pressed="true"] b::after{content:" ✓"}
/* Part lines */
.part{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:2fr 3fr;gap:8px}
.part:first-of-type{border-top:0;padding-top:0}
.part .nums{grid-column:1/-1;display:grid;grid-template-columns:70px 1fr 1fr 1fr auto;gap:8px;align-items:end}
.part .pnrow{display:flex;gap:6px;align-items:end}
.part .pnrow .fld{flex:1}
.part .foot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px}
/* Price table */
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;background:var(--sunk)}
th.num{text-align:right}
td{padding:9px 10px;border-top:1px solid var(--line)}
tr.total td{font-size:18px;font-weight:700;border-top:2px solid var(--ink)}
tr.collect td{font-size:20px;font-weight:700;background:var(--good-bg);color:var(--good)}
td input{max-width:110px;margin-left:auto;text-align:right}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(760px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dbody{padding:16px;display:flex;flex-direction:column;gap:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);max-width:min(92vw,560px);z-index:50;font-weight:600}
#toast.bad{background:var(--bad);color:#fff}
@media (max-width:640px){ input,select{font-size:16px} .wrap{padding:10px 10px 80px} .part{grid-template-columns:1fr} .part .nums{grid-template-columns:1fr 1fr} td,th{padding:8px 6px} }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../app.css">
</head>
<body>
<script src="../shell.js" data-base="../" data-page="pricing" data-bar="1"></script>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script>
/* Job pricing v1: a calculator. Nothing is saved and no customer details are entered.
     repair:     price = labor level + parts (no diagnostic fee)
     no repair:  price = the diagnostic fee only (pricing_models.service_charge), collected in full today
   Parts use the same sell-price rule as Part lookup (pricing_models, see *part_lookup_v1.sql).
   The card price is the listed price. Check or cash takes the discount in pricing_settings (3.5%).
   Sales tax applies to the whole job. A return visit collects a deposit (50%); a same-day repair collects it all.
   Labor levels and the settings are edited by admins from the Prices button. See *job_pricing.sql. */
const CFG=window.COACH_CONFIG||{};
const SB=(window.supabase&&CFG.supabaseUrl)?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey):null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((Number(n)||0)*100+1e-7)/100;
const money=n=>'$'+r2(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const numOrNull=v=>{v=String(v==null?'':v).trim().replace(/^\$/,'').replace(/,/g,'');if(v==='')return null;const n=Number(v);return isFinite(n)&&n>=0?n:null};
const normPn=v=>String(v||'').trim().toUpperCase().replace(/\s+/g,'');
const pill=(l,t)=>`<span class="pill ${t||''}">${esc(l)}</span>`;
const store={get:k=>{try{return JSON.parse(localStorage.getItem('pricing.'+k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem('pricing.'+k,JSON.stringify(v))}catch(e){}}};

const blankPart=()=>({pn:'',desc:'',qty:'1',list:'',cost:'',sell:'',note:'',busy:false});
const blankQuote=()=>({model:'',tier:'',parts:[],tax:'',collected:'',sameDay:false});
const S={session:null,me:null,models:[],tiers:[],settings:null,err:'',dlg:null,armed:null,q:store.get('q')||blankQuote()};
const isAdmin=()=>!!S.me&&S.me.role==='admin';
const allowed=()=>!!S.me&&['csr','admin','tech'].includes(S.me.role);
const curModel=()=>S.models.find(m=>m.id===S.q.model)||null;
const modelTiers=()=>S.tiers.filter(t=>t.model_id===S.q.model).sort((a,b)=>a.sort-b.sort||a.price-b.price);
const curTier=()=>modelTiers().find(t=>t.id===S.q.tier)||null;

let toastTimer;
function toast(msg,bad){const t=$('toast');t.textContent=msg;t.className=bad?'bad':'';t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},bad?7000:4200)}
const saveDraft=()=>store.set('q',{...S.q,parts:S.q.parts.map(p=>({...p,busy:false}))});

/* ---------- the pricing rules ---------- */
/* Sell price for one part, each. Same rule as the database's part_sell_price plus the margin floor from rank_part_quotes:
     markup % = M / base^(1/r),  sell = base x (1 + markup %),  never below cost / (1 - min margin).
   base is the list price (MSRP), or our cost when the model is set to force cost. */
function partPrice(p,m){
  const list=numOrNull(p.list),cost=numOrNull(p.cost),typed=numOrNull(p.sell);
  let formula=null,floor=null;
  if(m){const base=m.force_cost?cost:list;
    if(base>0&&m.m>0&&m.r>0)formula=r2(base*(1+Number(m.m)/Math.pow(base,1/Number(m.r))));
    if(cost>0&&m.min_margin!=null&&m.min_margin<1)floor=r2(cost/(1-Number(m.min_margin)))}
  const auto=formula==null?null:Math.max(formula,floor||0);
  const each=typed!=null?typed:auto;
  return {each,auto,floor,typed:typed!=null,
    from:typed!=null?'typed':auto==null?'':floor!=null&&floor>formula?'floor':m&&m.force_cost?'cost':'list',
    belowFloor:each!=null&&floor!=null&&each<floor-0.005,
    oddList:list>0&&cost>0&&list<cost*1.3};
}
function totals(){
  const m=curModel(),t=curTier(),st=S.settings||{};
  const repair=!!t;
  const svc=repair?0:(m?Number(m.service_charge)||0:0),labor=t?Number(t.price)||0:0;
  let parts=0,missing=0;
  S.q.parts.forEach(p=>{const pp=partPrice(p,m),q=Math.max(1,parseInt(p.qty,10)||1);if(pp.each==null)missing++;else parts+=pp.each*q});
  parts=r2(parts);
  const sub=r2(svc+labor+parts);
  const rate=(S.q.tax!==''?numOrNull(S.q.tax):st.tax_rate==null?null:Number(st.tax_rate)*100);
  const disc=Number(st.cash_discount==null?0.035:st.cash_discount),dep=Number(st.deposit_pct==null?0.5:st.deposit_pct);
  const collected=numOrNull(S.q.collected)||0;
  const col=off=>{const d=r2(sub*off),net=r2(sub-d),tax=rate==null?0:r2(net*rate/100),total=r2(net+tax),due=Math.max(0,r2(total-collected));
    const today=(S.q.sameDay||!repair)?due:r2(due*dep);return {disc:d,tax,total,due,today,later:r2(due-today)}};
  return {repair,full:S.q.sameDay||!repair,svc,labor,parts,sub,rate,discPct:disc,depPct:dep,collected,missing,card:col(0),cash:col(disc)};
}

/* ---------- data ---------- */
async function whoami(){
  const {data}=await SB.from('profiles').select('id,display_name,email,role,manager').eq('id',S.session.user.id).maybeSingle();
  S.me=data||{role:'pending',email:S.session.user.email,display_name:''};
}
async function loadBase(){
  const [m,t,s]=await Promise.all([SB.from('pricing_models').select('*').order('sort'),SB.from('labor_tiers').select('*').order('sort'),SB.from('pricing_settings').select('*').maybeSingle()]);
  const bad=[m,t,s].find(r=>r.error);if(bad){S.err=bad.error.message;render();return}
  S.models=m.data||[];S.tiers=t.data||[];S.settings=s.data||{};S.err='';
  if(!S.models.some(x=>x.id===S.q.model))S.q.model=(S.models.find(x=>x.is_default)||S.models[0]||{}).id||'';
  if(!curTier())S.q.tier='';
  render();
}
/* Fill a part line from the saved vendor prices (the same pick Part lookup shows). */
async function lookupPart(i){
  const p=S.q.parts[i];if(!p)return;const pn=normPn(p.pn);if(pn.length<3){toast('Type the part number first.',true);return}
  p.pn=pn;p.busy=true;render();
  const {data,error}=await SB.rpc('rank_part_quotes',{p_part:pn,p_model:S.q.model||null});
  p.busy=false;
  if(error){render();toast(error.message,true);return}
  const rows=data||[],pick=rows.find(r=>r.pick_rank===1)||rows[0];
  if(!pick){p.note='No saved vendor price for this part. Type the list price and our cost.';render();return}
  if(pick.msrp_used!=null)p.list=String(pick.msrp_used);
  if(pick.cost!=null)p.cost=String(pick.cost);
  if(pick.description&&!p.desc)p.desc=pick.description;
  p.sell='';p.note=`From ${pick.vendor_name||'vendor'}${pick.stale?' (old price: check it again)':''}`;
  saveDraft();render();
}

/* ---------- views ---------- */
function vLogin(){return `<form class="card" id="login"><h2>City Appliance Job pricing</h2>
  <p class="muted">Sign in with the email and password you were given.</p>
  <label class="fld"><span>Email</span><input id="lgEmail" type="email" autocomplete="username" required></label>
  <label class="fld"><span>Password</span><input id="lgPass" type="password" autocomplete="current-password" required></label>
  <button class="primary" type="submit">Sign in</button><div id="lgMsg" class="muted" role="status"></div></form>`}
function vWaiting(){return `<div class="card"><h2>No access to Job pricing</h2>
  <p>You are signed in as ${esc(S.me.email||'')}. Job pricing is for the office and technicians. Ask Jake if you need it.</p>
  <button data-a="signout">Sign out</button></div>`}

function vPart(p,i){
  const pp=partPrice(p,curModel());
  return `<div class="part">
    <div class="pnrow"><label class="fld"><span>Part number</span><input class="mono" data-k="p${i}.pn" value="${esc(p.pn)}" autocapitalize="characters" autocomplete="off" spellcheck="false"></label>
      <button data-a="lookup" data-i="${i}" ${p.busy?'disabled':''}>${p.busy?'Looking…':'Look up'}</button></div>
    <label class="fld"><span>Description</span><input data-k="p${i}.desc" value="${esc(p.desc)}"></label>
    <div class="nums">
      <label class="fld"><span>Qty</span><input data-k="p${i}.qty" value="${esc(p.qty)}" inputmode="numeric"></label>
      <label class="fld"><span>List price (MSRP)</span><input data-k="p${i}.list" value="${esc(p.list)}" inputmode="decimal" placeholder="0.00"></label>
      <label class="fld"><span>Our cost</span><input data-k="p${i}.cost" value="${esc(p.cost)}" inputmode="decimal" placeholder="0.00"></label>
      <label class="fld"><span>Sell price each</span><input data-k="p${i}.sell" value="${esc(p.sell)}" inputmode="decimal" placeholder="${pp.auto==null?'Type a price':r2(pp.auto).toFixed(2)}"></label>
      <button class="small ghost" data-a="delpart" data-i="${i}" aria-label="Remove this part">Remove</button>
    </div>
    <div class="foot" id="pf${i}">${partFoot(p,pp)}</div>
  </div>`}
function partFoot(p,pp){
  const out=[];
  if(pp.each==null)out.push(pill('Needs a price','bad')+' <span class="muted">Enter the list price, or type a sell price.</span>');
  else out.push(`<b>${money(pp.each)} each</b> <span class="muted">${{typed:'typed by hand',list:'from list price',cost:'from our cost',floor:'raised to the margin floor'}[pp.from]||''}</span>`);
  if(pp.belowFloor)out.push(pill('Below the margin floor of '+money(pp.floor),'warn'));
  if(pp.oddList)out.push(pill('List price looks low next to our cost: check it','warn'));
  if(p.note)out.push(`<span class="muted">${esc(p.note)}</span>`);
  return out.join(' ')}

function vTotals(){
  const t=totals(),c=t.card,k=t.cash;
  const line=(l,a,b,cls)=>`<tr class="${cls||''}"><td>${l}</td><td class="num">${a}</td><td class="num">${b}</td></tr>`;
  return `<div class="panel"><div class="pad" style="padding-bottom:6px"><h3>Price</h3>
      ${t.missing?`<div class="notice bad">${t.missing} part${t.missing===1?' has':'s have'} no price yet, so the totals below leave ${t.missing===1?'it':'them'} out.</div>`:''}
      ${t.rate==null?'<div class="notice">No sales tax rate is set. Type the rate below, or ask an admin to set it under Prices. Totals are before tax until then.</div>':''}</div>
    <table><thead><tr><th></th><th class="num">Card</th><th class="num">Check or cash</th></tr></thead><tbody>
      ${t.repair?line('Labor: '+esc(curTier().name),money(t.labor),money(t.labor)):line('Diagnostic fee (no repair)',money(t.svc),money(t.svc))}
      ${t.repair||t.parts||t.missing?line('Parts',money(t.parts),money(t.parts)):''}
      ${line(`Check or cash discount (${r2(t.discPct*100)}%)`,'',k.disc?'−'+money(k.disc):money(0))}
      <tr><td><label for="tax">Sales tax %</label></td><td class="num" colspan="2"><input id="tax" data-k="tax" value="${esc(S.q.tax!==''?S.q.tax:t.rate==null?'':String(r2(t.rate*1000)/1000))}" inputmode="decimal" placeholder="0.00"></td></tr>
      ${line('Sales tax',money(c.tax),money(k.tax))}
      ${line('Total',money(c.total),money(k.total),'total')}
      <tr><td><label for="collected">Already collected (for example the diagnostic fee)</label></td><td class="num" colspan="2"><input id="collected" data-k="collected" value="${esc(S.q.collected)}" inputmode="decimal" placeholder="0.00"></td></tr>
      ${t.collected?line('Still owed',money(c.due),money(k.due)):''}
      ${line(!t.repair?'Collect today':S.q.sameDay?'Collect today (repair finished)':`Collect today (${r2(t.depPct*100)}% deposit)`,money(c.today),money(k.today),'collect')}
      ${t.full?'':line('Balance on the return visit',money(c.later),money(k.later))}
    </tbody></table></div>`}

function vMain(){
  const m=curModel(),tiers=modelTiers(),q=S.q;
  return `<div class="top"><h1 class="grow">Job pricing</h1>
      ${isAdmin()?'<button data-a="prices">Prices</button>':''}</div>
  <div class="wrap">
    ${S.err?`<div class="notice bad">Could not load prices: ${esc(S.err)}</div>`:''}
    <div class="panel pad"><h3>1. Appliance class</h3>
      <div class="choices">${S.models.map(x=>`<button class="choice" data-a="model" data-id="${x.id}" aria-pressed="${x.id===q.model}"><b>${esc(x.name)}</b><span>Diagnostic fee ${money(x.service_charge)} if no repair</span></button>`).join('')||'<div class="muted">No pricing models found.</div>'}</div></div>
    <div class="panel pad"><h3>2. Repair labor</h3>
      <p class="muted" style="margin:0 0 8px">A repair is labor plus parts. The diagnostic fee is charged only when the customer does not go ahead.</p>
      ${tiers.length?`<div class="choices"><button class="choice" data-a="tier" data-id="" aria-pressed="${!q.tier}"><b>No repair</b><span>Diagnostic fee only</span></button>
        ${tiers.map(t=>`<button class="choice" data-a="tier" data-id="${t.id}" aria-pressed="${t.id===q.tier}"><b>${esc(t.name)}</b><span>${money(t.price)}</span></button>`).join('')}</div>`
      :`<div class="notice">No labor levels are set for ${esc(m?m.name:'this class')} yet. ${isAdmin()?'Add them under Prices, top right.':'Ask an admin to add them.'}</div>`}</div>
    <div class="panel pad"><h3>3. Parts</h3>
      ${q.parts.map(vPart).join('')||'<div class="muted" style="margin-bottom:10px">No parts on this job yet.</div>'}
      <div class="row" style="margin-top:6px"><button data-a="addpart">Add a part</button></div></div>
    ${curTier()?`<div class="panel pad"><h3>4. Is the repair finished today?</h3>
      <div class="choices"><button class="choice" data-a="sameday" data-v="0" aria-pressed="${!q.sameDay}"><b>Return visit needed</b><span>Collect a deposit today</span></button>
        <button class="choice" data-a="sameday" data-v="1" aria-pressed="${!!q.sameDay}"><b>Finished today</b><span>Collect the full amount</span></button></div></div>`:''}
    <div id="totals">${vTotals()}</div>
    <div class="row"><button class="primary" data-a="copy">Copy summary</button><button data-a="${S.armed==='reset'?'reset':'armreset'}">${S.armed==='reset'?'Tap again to clear everything':'Start over'}</button>
      <span class="muted">Nothing here is saved. Copy the summary into the job notes.</span></div>
  </div>`}

/* Admin: labor levels and settings */
function dPrices(){
  const st=S.settings||{};
  return `<div class="dhead"><h2 class="grow">Prices</h2><button class="small" data-a="close">Done</button></div><div class="dbody">
    <div><h3>Settings</h3><div class="row">
      <label class="fld" style="flex:1 1 140px"><span>Sales tax %</span><input data-st="tax_rate" value="${st.tax_rate==null?'':r2(st.tax_rate*100000)/1000}" inputmode="decimal" placeholder="Not set"></label>
      <label class="fld" style="flex:1 1 140px"><span>Check or cash discount %</span><input data-st="cash_discount" value="${r2((st.cash_discount==null?0.035:st.cash_discount)*10000)/100}" inputmode="decimal"></label>
      <label class="fld" style="flex:1 1 140px"><span>Deposit on a return visit %</span><input data-st="deposit_pct" value="${r2((st.deposit_pct==null?0.5:st.deposit_pct)*1000)/10}" inputmode="decimal"></label></div></div>
    ${S.models.map(m=>{const ts=S.tiers.filter(t=>t.model_id===m.id).sort((a,b)=>a.sort-b.sort||a.price-b.price);
      return `<div><h3>${esc(m.name)}: labor levels</h3>
        ${ts.map(t=>`<div class="row" style="margin-bottom:6px"><input style="flex:2 1 160px" data-t="${t.id}" data-tk="name" value="${esc(t.name)}" aria-label="Labor level name">
          <input style="flex:1 1 90px" data-t="${t.id}" data-tk="price" value="${esc(t.price)}" inputmode="decimal" aria-label="Labor price">
          <button class="small" data-a="deltier" data-id="${t.id}">${S.armed===t.id?'Tap again to delete':'Delete'}</button></div>`).join('')||'<div class="muted" style="margin-bottom:6px">None yet.</div>'}
        <form class="row" data-newtier="${m.id}"><input style="flex:2 1 160px" name="name" placeholder="Name, for example Minor repair" required maxlength="60">
          <input style="flex:1 1 90px" name="price" inputmode="decimal" placeholder="Price" required><button class="small" type="submit">Add</button></form></div>`}).join('')}
    <p class="muted">Diagnostic fees and part markups are set in Part lookup, under Pricing models.</p></div>`}

function summaryText(){
  const t=totals(),m=curModel(),tr=curTier(),L=[];
  L.push(`Quote (${m?m.name:'no class chosen'})`);
  if(tr)L.push(`Labor, ${tr.name}: ${money(t.labor)}`);else L.push(`No repair. Diagnostic fee: ${money(t.svc)}`);
  S.q.parts.forEach(p=>{const pp=partPrice(p,m),q=Math.max(1,parseInt(p.qty,10)||1);
    L.push(`Part ${p.pn||'(no number)'}${p.desc?' '+p.desc:''}: ${pp.each==null?'NOT PRICED':(q>1?q+' x '+money(pp.each)+' = ':'')+money(pp.each*q)}`)});
  L.push(`Sales tax${t.rate==null?' (rate not set)':' '+r2(t.rate*1000)/1000+'%'}: card ${money(t.card.tax)}, check or cash ${money(t.cash.tax)}`);
  L.push(`Total by card: ${money(t.card.total)}`);
  L.push(`Total by check or cash (${r2(t.discPct*100)}% off): ${money(t.cash.total)}`);
  if(t.collected)L.push(`Already collected: ${money(t.collected)}`);
  L.push(!t.repair?`Collect today: card ${money(t.card.today)}, check or cash ${money(t.cash.today)}`:S.q.sameDay?`Collect today, repair finished: card ${money(t.card.today)}, check or cash ${money(t.cash.today)}`
    :`Collect today (${r2(t.depPct*100)}% deposit): card ${money(t.card.today)}, check or cash ${money(t.cash.today)}. Balance on return: card ${money(t.card.later)}, check or cash ${money(t.cash.later)}`);
  return L.join('\n')}

/* ---------- actions ---------- */
const A={
  signout:async()=>{await SB.auth.signOut({scope:'local'});location.reload()},
  model:d=>{S.q.model=d.id;S.q.tier='';S.q.parts.forEach(p=>{p.note=p.note&&p.sell===''?p.note:p.note});saveDraft();render()},
  tier:d=>{S.q.tier=d.id;saveDraft();render()},
  sameday:d=>{S.q.sameDay=d.v==='1';saveDraft();render()},
  addpart:()=>{S.q.parts.push(blankPart());saveDraft();render();const n=document.querySelector(`[data-k="p${S.q.parts.length-1}.pn"]`);if(n)n.focus()},
  delpart:d=>{S.q.parts.splice(Number(d.i),1);saveDraft();render()},
  lookup:d=>lookupPart(Number(d.i)),
  armreset:()=>{S.armed='reset';render();setTimeout(()=>{if(S.armed==='reset'){S.armed=null;render()}},5000)},
  reset:()=>{S.armed=null;const model=S.q.model;S.q=blankQuote();S.q.model=model;saveDraft();render();window.scrollTo(0,0)},
  copy:async()=>{const txt=summaryText();try{await navigator.clipboard.writeText(txt);toast('Summary copied. Paste it into the job notes.')}catch(e){window.prompt('Copy this summary:',txt)}},
  prices:()=>{S.dlg='prices';renderDlg()},
  close:()=>{S.dlg=null;$('dlg').close()},
  deltier:async d=>{
    if(S.armed!==d.id){S.armed=d.id;renderDlg();setTimeout(()=>{if(S.armed===d.id){S.armed=null;renderDlg()}},5000);return}
    S.armed=null;const {error}=await SB.from('labor_tiers').delete().eq('id',d.id);
    if(error){toast(error.message,true);return}S.tiers=S.tiers.filter(t=>t.id!==d.id);if(S.q.tier===d.id)S.q.tier='';toast('Labor level deleted.');renderDlg();render()},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||!A[el.dataset.a])return;e.preventDefault();A[el.dataset.a](el.dataset,el)});
/* Typing updates the numbers in place, without redrawing the field being typed in. */
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  const m=k.match(/^p(\d+)\.(\w+)$/);
  if(m){const p=S.q.parts[Number(m[1])];if(!p)return;p[m[2]]=e.target.value;if(m[2]==='pn')p.note='';
    const f=$('pf'+m[1]);if(f)f.innerHTML=partFoot(p,partPrice(p,curModel()))}
  else S.q[k]=e.target.value;
  saveDraft();
  if(k!=='tax'&&k!=='collected')$('totals').innerHTML=vTotals();});
document.addEventListener('change',async e=>{const el=e.target,d=el.dataset||{};
  if(d.k){if(/\.pn$/.test(d.k)){const p=S.q.parts[Number(d.k.match(/\d+/)[0])];if(p)p.pn=normPn(p.pn)}render();return}
  if(d.st){const pct=numOrNull(el.value);
    if(d.st==='tax_rate'?(el.value.trim()!==''&&(pct==null||pct>=20)):(pct==null||pct>(d.st==='deposit_pct'?100:50))){toast('Enter a percentage, like 8.25.',true);renderDlg();return}
    const val=el.value.trim()===''?null:Math.round(pct*1000)/100000;
    const {error}=await SB.from('pricing_settings').update({[d.st]:val}).eq('id',true);
    if(error){toast(error.message,true);renderDlg();return}
    S.settings[d.st]=val;if(d.st==='tax_rate')S.q.tax='';toast('Saved.');renderDlg();render();return}
  if(d.t){const t=S.tiers.find(x=>x.id===d.t);if(!t)return;
    const val=d.tk==='price'?numOrNull(el.value):el.value.trim();
    if(val==null||val===''){toast(d.tk==='price'?'Enter a price, like 185.00.':'The level needs a name.',true);renderDlg();return}
    const {error}=await SB.from('labor_tiers').update({[d.tk]:val}).eq('id',t.id);
    if(error){toast(error.message,true);renderDlg();return}
    t[d.tk]=val;toast('Saved.');renderDlg();render()}});
document.addEventListener('submit',async e=>{
  const f=e.target;
  if(f.dataset&&f.dataset.newtier){e.preventDefault();
    const name=f.elements.name.value.trim(),price=numOrNull(f.elements.price.value);
    if(!name||price==null){toast('Enter a name and a price, like 185.00.',true);return}
    const sort=S.tiers.filter(t=>t.model_id===f.dataset.newtier).length+1;
    const {data,error}=await SB.from('labor_tiers').insert({model_id:f.dataset.newtier,name,price,sort}).select().single();
    if(error){toast(/duplicate/.test(error.message)?'That class already has a level with this name.':error.message,true);return}
    S.tiers.push(data);toast('Labor level added.');renderDlg();render();return}
  if(f.id!=='login')return;e.preventDefault();
  const msg=$('lgMsg');msg.textContent='Signing in…';
  const {data,error}=await SB.auth.signInWithPassword({email:$('lgEmail').value.trim(),password:$('lgPass').value});
  if(error){msg.textContent=error.message;return}
  S.session=data.session;await whoami();render();if(allowed())loadBase()});
$('dlg').addEventListener('close',()=>{S.dlg=null});

function renderDlg(){const d=$('dlg');if(S.dlg==='prices'){d.innerHTML=dPrices();if(!d.open)d.showModal()}}
function render(){
  if(window.AppShell)AppShell.set(S.session?S.me:null);   /* the shared menu shows what this role can open */
  const a=document.activeElement,fk=a&&a.dataset&&a.dataset.k,pos=a&&a.selectionStart;
  $('app').innerHTML=!SB?'<div class="card"><h2>Job pricing</h2><p>This page is missing its configuration (config.js).</p></div>'
    :!S.session?vLogin():!S.me||!allowed()?(S.me?vWaiting():''):vMain();
  const n=fk?document.querySelector(`[data-k="${fk}"]`):null;
  if(n){n.focus();try{if(pos!=null)n.setSelectionRange(pos,pos)}catch(x){}}
}
(async function boot(){
  if(!SB){render();return}
  const {data:{session}}=await SB.auth.getSession();S.session=session;
  SB.auth.onAuthStateChange((ev,s)=>{if(s)S.session=s});
  if(session)await whoami();
  render();if(S.session&&allowed())loadBase();
})();
</script>
</body>
</html>
