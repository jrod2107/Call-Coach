<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#1e40af">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<title>City Appliance — Settings</title>
<style>
:root{
  --bg:#f3f4f6; --surface:#ffffff; --sunk:#eceef1; --ink:#171a1e; --muted:#5d6670; --line:#d8dce1;
  --accent:#1e40af; --accent-ink:#ffffff; --accent-text:#1e40af;
  --warn:#8a4b00; --warn-bg:#fcecd2; --good:#17623a; --good-bg:#dcf1e3; --bad:#9c241c; --bad-bg:#fae1de;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#111315; --surface:#1a1d21; --sunk:#22262b; --ink:#e8eaed; --muted:#9aa3ad; --line:#2f353c;
  --accent:#2f5fd0; --accent-ink:#ffffff; --accent-text:#8fb0ff;
  --warn:#f0b962; --warn-bg:#3a2c12; --good:#80d4a2; --good-bg:#14311f; --bad:#f39c94; --bad-bg:#3c1a17;
  color-scheme:dark } }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3{margin:0;font-weight:700}
h1{font-size:18px} h2{font-size:22px}
h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.muted{color:var(--muted)} .grow{flex:1}
.top{background:var(--accent);color:var(--accent-ink);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.top .who{font-size:12px;opacity:.9}
.tools{display:flex;flex-wrap:wrap;gap:4px}
.tools a{color:#fff;text-decoration:none;font-weight:600;padding:6px 11px;border-radius:var(--r);background:rgba(255,255,255,.14)}
.tools a:hover{background:rgba(255,255,255,.28)}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.top button{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.stat:hover,.tile:hover{border-color:var(--accent-text)}
.stat b{font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)} .stat.good b{color:var(--good)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:3px}
.tile b{font-size:15px;color:var(--accent-text)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 12px;background:var(--sunk);white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line)}
td select{width:150px}
.card{max-width:380px;margin:9vh auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld>span{font-size:12px;color:var(--muted);font-weight:600}
.notice{background:var(--bad-bg);color:var(--bad);border-radius:var(--r);padding:9px 11px;margin:10px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);max-width:min(92vw,560px);z-index:50;font-weight:600}
#toast.bad{background:var(--bad);color:#fff}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;width:100%;min-height:60px;resize:vertical}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;max-width:560px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{background:var(--sunk);border-radius:var(--r);padding:9px 11px;color:var(--muted)}
.ok{color:var(--good);font-weight:600} .bad{color:var(--bad);font-weight:600}
.part{font-size:16px;margin:34px 0 0;padding-top:18px;border-top:1px solid var(--line)}
td.narrow{width:1%;white-space:nowrap} td input{min-width:140px}
button:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script>
/* Settings. Two parts on one page:
   My account       every signed-in team member: their own name, usual location and password. Nothing here can
                    change a role or touch anyone else (set_my_profile only writes the caller's own row).
   Company settings admins: team and access, property manager approval processes, email collection.
                    Managers also see the intake lists.
   The page only shows what the database will let that person do; row-level security and the functions decide. */
const CFG=window.COACH_CONFIG||{};
const HERE=location.origin+location.pathname;
const SB=(window.supabase&&CFG.supabaseUrl)?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey):null;
const $=id=>document.getElementById(id);
/* A password reset link lands here. Only the sign-in library can say the link was genuine (it checks it with the
   server and then reports PASSWORD_RECOVERY), so the "set a new password" form is shown on that signal alone and
   never because of something typed into the address. Registered straight away so the signal is not missed. */
let RECOVERY_SEEN=false;
if(SB)SB.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){RECOVERY_SEEN=true;if(typeof S!=='undefined'){S.recovery=true;if(S.me)render()}}});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtWhen=iso=>iso?new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
/* Manager is an Office (csr) account with profiles.manager set; Senior technician is a tech with profiles.senior. */
const ROLES=['admin','manager','csr','senior','tech','stock','pending'];
const ROLE_NAME={admin:'Admin',manager:'Manager',csr:'Office (takes calls)',senior:'Senior technician',tech:'Technician',stock:'Stock helper',pending:'Waiting for access'};
const roleKey=u=>u&&u.role==='csr'&&u.manager?'manager':u&&u.role==='tech'&&u.senior?'senior':(u&&u.role);
const S={session:null,me:null,locs:[],team:[],procs:[],procEdit:null,others:[],brands:[],col:null,mail:[],loading:false,err:'',pw:{busy:false,msg:'',ok:false},acct:{busy:false},recovery:false};
const admin=()=>!!S.me&&S.me.role==='admin';
const office=()=>!!S.me&&['csr','admin'].includes(S.me.role);
const mgr=()=>!!S.me&&(S.me.role==='admin'||(S.me.role==='csr'&&!!S.me.manager));
const allowed=()=>!!S.me&&['csr','admin','tech','stock'].includes(S.me.role);

let toastTimer;
function toast(msg,bad){const t=$('toast');t.textContent=msg;t.className=bad?'bad':'';t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},bad?7000:4000)}

async function whoami(){
  const {data}=await SB.from('profiles').select('id,display_name,email,role,manager,senior,default_location_id').eq('id',S.session.user.id).maybeSingle();
  S.me=data||{id:S.session.user.id,role:'pending',email:S.session.user.email,display_name:''};
}
async function load(){
  S.loading=true;render();
  const since=new Date(Date.now()-90*864e5).toISOString(),week=new Date(Date.now()-7*864e5).toISOString();
  const none=Promise.resolve({data:[]});
  const [locs,team,procs,others,brands,col,mail]=await Promise.all([
    SB.from('stock_locations').select('id,name,kind,active').order('name'),
    admin()?SB.from('profiles').select('id,display_name,email,role,manager,senior').order('email'):none,
    office()?SB.from('work_order_source_processes').select('id,name,process,updated_at,updated_by_name').order('name'):none,
    mgr()?SB.from('intake_other_issues').select('appliance,brand,issue,taken_by,created_at').gte('created_at',since).order('created_at',{ascending:false}).limit(500):none,
    mgr()?SB.from('intake_other_brands').select('brand,appliance,created_at').gte('created_at',since).limit(1000):none,
    admin()?SB.rpc('collector_status'):Promise.resolve({data:null}),
    admin()?SB.from('work_order_mail').select('outcome,mailbox,created_at').gte('created_at',week).limit(1000):none]);
  S.loading=false;
  const bad=[locs,team,procs,others,brands,col,mail].find(r=>r&&r.error);S.err=bad?bad.error.message:'';
  S.locs=locs.data||[];S.team=team.data||[];S.procs=procs.data||[];S.others=others.data||[];S.brands=brands.data||[];S.col=col.data||null;S.mail=mail.data||[];
  render();
}

/* ---------- My account ---------- */
function vAccount(){
  const usesLoc=['tech','stock','admin'].includes(S.me.role);
  const locs=S.locs.filter(l=>l.active||l.id===S.me.default_location_id);
  return `<h3>My account</h3>
  <div class="box">
   <div class="fields">
    <label class="fld"><span>My name, as the team sees it</span><input id="acName" value="${esc(S.me.display_name||'')}" maxlength="60" autocomplete="name"></label>
    ${usesLoc?`<label class="fld"><span>My usual truck or location</span><select id="acLoc"><option value="">None</option>${locs.map(l=>`<option value="${l.id}" ${S.me.default_location_id===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label>`:''}
   </div>
   <div class="muted">Your name appears on call intakes, part requests and work order history.${usesLoc?' Stock opens on your usual location.':''}</div>
   <div class="row"><button class="primary" data-a="saveacct" ${S.acct.busy?'disabled':''}>${S.acct.busy?'Saving…':'Save'}</button>
    <span class="muted">Signed in as ${esc(S.me.email||'')} · ${esc(ROLE_NAME[roleKey(S.me)]||S.me.role)}</span></div>
  </div>
  <h3>${S.recovery?'Set a new password':'Change my password'}</h3>
  ${S.recovery?'<div class="notice" style="max-width:560px;margin:0 0 10px;background:var(--warn-bg);color:var(--warn)"><b>You opened a password reset link.</b> Choose a new password below to finish.</div>':''}
  <form class="box" id="pwform" autocomplete="off">
   <div class="fields">
    ${S.recovery?'':`<label class="fld"><span>Current password</span><input id="pwOld" type="password" autocomplete="current-password" required></label>`}
    <label class="fld"><span>New password</span><input id="pwNew" type="password" autocomplete="new-password" minlength="10" required></label>
    <label class="fld"><span>New password again</span><input id="pwNew2" type="password" autocomplete="new-password" minlength="10" required></label>
   </div>
   <div class="muted">At least 10 characters. You stay signed in on this device; other devices will need the new password next time they sign in.</div>
   <div class="row"><button class="primary" type="submit" ${S.pw.busy?'disabled':''}>${S.pw.busy?'Saving…':S.recovery?'Set new password':'Change password'}</button>
    ${S.pw.msg?`<span class="${S.pw.ok?'ok':'bad'}" role="status">${esc(S.pw.msg)}</span>`:''}</div>
  </form>`;
}

/* ---------- Company settings ---------- */
function vTeam(){
  if(!admin())return'';
  return `<h3>Team and access</h3><div class="panel"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Password</th></tr></thead><tbody>
   ${S.team.map(u=>`<tr><td><input data-user="${u.id}" data-k="display_name" value="${esc(u.display_name)}" placeholder="Name shown to the team" aria-label="Name for ${esc(u.email)}"></td><td>${esc(u.email)}</td>
     <td>${u.id===S.me.id?esc(ROLE_NAME[roleKey(u)])+' <span class="muted">(you)</span>':`<select data-user="${u.id}" data-k="role" aria-label="Role for ${esc(u.email)}">${ROLES.map(r=>`<option value="${r}" ${roleKey(u)===r?'selected':''}>${ROLE_NAME[r]}</option>`).join('')}</select>`}</td>
     <td class="narrow">${u.id===S.me.id?'<span class="muted">Change it above</span>':`<button data-a="sendreset" data-id="${u.id}">Email a reset link</button>`}</td></tr>`).join('')}</tbody></table></div>
   <p class="muted" style="margin-top:8px">New accounts are created in the Supabase dashboard and start as "Waiting for access". Set the role here to let someone in. A reset link is emailed to that person; it brings them to this page to choose a new password. You never see their password.</p>`;
}
function vProcs(){
  if(!office())return'';
  const ed=S.procEdit;
  const row=p=>ed&&ed.id===p.id?editRow():`<tr><td><b>${esc(p.name)}</b></td><td style="white-space:pre-wrap">${esc(p.process)}</td>
     <td class="narrow">${admin()?`<button data-a="procedit" data-id="${p.id}">Edit</button>`:''}</td></tr>`;
  const editRow=()=>`<tr><td><input id="prName" value="${esc(ed.name)}" maxlength="80" aria-label="Company name contains" placeholder="Company name contains"></td>
     <td><textarea id="prText" aria-label="Approval process" placeholder="Who to call or what to do to get approval">${esc(ed.process)}</textarea></td>
     <td class="narrow"><div class="row"><button class="primary" data-a="procsave">Save</button><button data-a="proccancel">Cancel</button>${ed.id?`<button data-a="procdel">Remove</button>`:''}</div></td></tr>`;
  return `<h3>Property managers and other senders: approval process</h3><div class="panel"><table><thead><tr><th>Company name contains</th><th>How to get approval</th><th></th></tr></thead><tbody>
   ${S.procs.map(row).join('')||(!ed?'<tr><td colspan="3" class="muted">None saved yet.</td></tr>':'')}${ed&&!ed.id?editRow():''}</tbody></table></div>
   <div class="row" style="margin-top:8px">${admin()&&!ed?'<button data-a="procadd">+ Add a company</button>':''}
    <span class="muted">Shown on that company's work orders, in the intake guide, and added to the Housecall Pro job as its own note.</span></div>`;
}
function vCollector(){
  if(!admin())return'';
  const c=S.col||{};let last={};try{last=JSON.parse(c.last_run||'{}')}catch(e){}
  const boxes=String(c.mailboxes||'').split(',').map(s=>s.trim()).filter(Boolean);
  const tally={};S.mail.forEach(m=>{tally[m.outcome]=(tally[m.outcome]||0)+1});
  const mins=last.at?Math.round((Date.now()-new Date(last.at).getTime())/60000):null;
  const stale=mins!=null&&mins>30;
  const health=!last.at?'<span class="bad">It has not run yet.</span>'
    :last.ok&&!stale?`<span class="ok">Working.</span> Last checked ${esc(fmtWhen(last.at))}.`
    :stale?`<span class="bad">It has not checked for ${mins>120?Math.round(mins/60)+' hours':mins+' minutes'}.</span> It should run every 10 minutes.`
    :`<span class="bad">The last check had a problem.</span> ${esc(fmtWhen(last.at))}: ${esc(last.error||(last.problems||[]).join('; ')||'unknown')}`;
  return `<h3>Work order email collection</h3>
  <div class="box" style="max-width:none">
   <div>${health}</div>
   <div class="muted">Last 7 days: ${tally.draft||0} new work orders, ${tally.update||0} follow-ups added as notes, ${tally.duplicate||0} repeats, ${tally.ignored||0} other emails skipped${tally.error?`, <span class="bad">${tally.error} could not be read</span>`:''}.</div>
   <label class="fld"><span>Senders it reads (the part after the @, separated by commas)</span><input id="colSenders" value="${esc(String(c.senders||'').split(',').join(', '))}" spellcheck="false" autocapitalize="off"></label>
   <div class="muted">Only email from these senders is ever opened. Everything else in the inboxes is left alone. Add a company's own domain here if its staff email you directly.</div>
   <div class="row"><button class="primary" data-a="savesenders">Save senders</button></div>
   <div class="fld"><span style="font-size:12px;color:var(--muted);font-weight:600">Inboxes it watches</span><div>${boxes.length?boxes.map(esc).join(', '):'None set.'}</div></div>
   <div class="note">Adding or removing an inbox has two steps: Microsoft must allow it (a command in Exchange) and it must be added here. Ask for it to be changed so both happen together.</div>
  </div>`;
}
function vIntakeLists(){
  if(!mgr())return'';
  const by={};S.others.forEach(o=>{(by[o.appliance]=by[o.appliance]||[]).push(o)});
  const rows=Object.entries(by).sort((a,b)=>b[1].length-a[1].length);
  const bb={};S.brands.forEach(o=>{const k=String(o.brand).trim().toLowerCase();(bb[k]=bb[k]||{name:String(o.brand).trim(),n:0,apps:{}});bb[k].n++;if(o.appliance)bb[k].apps[o.appliance]=1});
  const brows=Object.values(bb).sort((a,b)=>b.n-a.n);
  return `<h3>Call intake: issues typed in under "Other", last 90 days</h3>
  ${rows.length?`<div class="panel"><table><thead><tr><th>Appliance</th><th>Times</th><th>What was typed</th></tr></thead><tbody>
   ${rows.map(([app,list])=>`<tr><td>${esc(app)}</td><td><b>${list.length}</b>${list.length>=3?' <span class="muted">· add to the list?</span>':''}</td>
     <td>${list.slice(0,8).map(o=>`${esc(o.issue)} <span class="muted">(${esc([o.brand,o.taken_by,String(o.created_at).slice(5,10)].filter(Boolean).join(', '))})</span>`).join('<br>')}${list.length>8?`<br><span class="muted">and ${list.length-8} more</span>`:''}</td></tr>`).join('')}</tbody></table></div>`
   :'<p class="muted">Nothing typed under Other yet.</p>'}
  <h3>Call intake: brands typed in under "Other", last 90 days</h3>
  ${brows.length?`<div class="panel"><table><thead><tr><th>Brand</th><th>Times</th><th>Appliances</th></tr></thead><tbody>
   ${brows.slice(0,25).map(r=>`<tr><td>${esc(r.name)}</td><td><b>${r.n}</b>${r.n>=3?' <span class="muted">· make it a button?</span>':''}</td><td>${esc(Object.keys(r.apps).join(', '))}</td></tr>`).join('')}</tbody></table></div>`
   :'<p class="muted">No brands typed under Other yet.</p>'}
  <p class="muted" style="margin-top:8px">When the same issue or brand keeps coming up, ask for it to be added to the intake's own list.</p>`;
}

function vSettings(){
  const company=admin()||mgr()||office();
  return `<header class="top"><h1>Settings</h1><nav class="tools" aria-label="Pages"><a href="../home/">← Home</a></nav><span class="grow"></span>
    <button data-a="refresh">${S.loading?'Loading…':'Refresh'}</button>
    <span class="who">${esc(S.me.display_name||S.me.email||'')} · ${esc(ROLE_NAME[roleKey(S.me)]||S.me.role)}</span><button data-a="signout">Sign out</button></header>
  <div class="wrap">
   ${S.err?`<div class="notice">Some settings could not be loaded: ${esc(S.err)}</div>`:''}
   ${vAccount()}
   ${company?`<h2 class="part">Company settings</h2><p class="muted" style="margin:4px 0 0">${admin()?'Only admins can change these.':'You can see these. An admin changes them.'}</p>`:''}
   ${vTeam()}${vProcs()}${vCollector()}${vIntakeLists()}</div>`;
}
function vLogin(){return `<form class="card" id="login"><h2>City Appliance</h2>
  <p class="muted">Sign in with your City Appliance email and password.</p>
  <label class="fld"><span>Email</span><input id="lgEmail" type="email" autocomplete="username" required></label>
  <label class="fld"><span>Password</span><input id="lgPass" type="password" autocomplete="current-password" required></label>
  <button class="primary" type="submit">Sign in</button><div id="lgMsg" class="muted" role="status"></div>
  <button type="button" data-a="forgot" style="border:0;background:none;color:var(--accent-text);padding:0;text-align:left">Forgot your password?</button></form>`}
function vWaiting(){return `<div class="card"><h2>Waiting for access</h2>
  <p>You are signed in as ${esc(S.me.email||'')}, but this account has not been given a role yet. Ask Jake to set it.</p>
  <button data-a="signout">Sign out</button></div>`}
function render(){
  $('app').innerHTML=!SB?'<div class="card"><h2>Settings</h2><p>This page is missing its configuration (config.js).</p></div>'
    :!S.session?vLogin():!allowed()?vWaiting():vSettings();
}

const A={
  refresh:()=>load(),
  /* Sends Supabase's own recovery email. The link returns to this page, which then asks for a new password. */
  sendreset:async d=>{const u=S.team.find(x=>x.id===d.id);if(!u||!admin())return;
    if(!confirm('Email a password reset link to '+u.email+'?\n\nTheir current password keeps working until they choose a new one.'))return;
    const {error}=await SB.auth.resetPasswordForEmail(u.email,{redirectTo:HERE});
    if(error){toast(/rate|limit|seconds/i.test(error.message)?'Too many emails were sent just now. Wait a few minutes and try again.':error.message,true);return}
    toast('Reset link emailed to '+u.email+'.')},
  forgot:async()=>{const email=($('lgEmail')||{}).value||'',msg=$('lgMsg');
    if(!/^\S+@\S+\.\S+$/.test(email.trim())){msg.textContent='Type your email above first, then press "Forgot your password?".';return}
    msg.textContent='Sending…';
    const {error}=await SB.auth.resetPasswordForEmail(email.trim(),{redirectTo:HERE});
    msg.textContent=error?(/rate|limit|seconds/i.test(error.message)?'Too many emails were sent just now. Wait a few minutes and try again.':error.message)
      :'If that email has an account, a reset link is on its way. Open it on this device.'},
  signout:async()=>{await SB.auth.signOut();location.reload()},
  saveacct:async()=>{if(S.acct.busy)return;const name=$('acName').value.trim(),locEl=$('acLoc'),loc=locEl?(locEl.value||null):(S.me.default_location_id||null);
    if(!name){toast('Your name cannot be blank.',true);return}
    S.acct.busy=true;render();
    const {error}=await SB.rpc('set_my_profile',{p_display_name:name,p_default_location_id:loc});
    S.acct.busy=false;
    if(error){toast(error.message,true);render();return}
    await whoami();const t=S.team.find(u=>u.id===S.me.id);if(t)t.display_name=S.me.display_name;toast('Saved.');render()},
  procadd:()=>{S.procEdit={id:null,name:'',process:''};render();const n=$('prName');if(n)n.focus()},
  procedit:d=>{const p=S.procs.find(x=>String(x.id)===d.id);if(!p||!admin())return;S.procEdit={id:p.id,name:p.name,process:p.process};render()},
  proccancel:()=>{S.procEdit=null;render()},
  procsave:async()=>{const ed=S.procEdit;if(!ed)return;const name=$('prName').value.trim(),process=$('prText').value.trim();
    if(name.length<2||!process){toast('Fill in the company name and the process.',true);return}
    const row={name,process,updated_at:new Date().toISOString(),updated_by_name:S.me.display_name||S.me.email||null};
    const r=ed.id?await SB.from('work_order_source_processes').update(row).eq('id',ed.id).select('id'):await SB.from('work_order_source_processes').insert(row).select('id');
    if(r.error||!(r.data||[]).length){toast('It could not be saved'+(r.error?': '+(/duplicate/.test(r.error.message)?'that company is already listed.':r.error.message):'.'),true);return}
    S.procEdit=null;toast('Approval process saved.');await load()},
  procdel:async(d,el)=>{const ed=S.procEdit;if(!ed||!ed.id)return;if(el.dataset.armed!=='1'){el.dataset.armed='1';el.textContent='Yes, remove it';el.style.color='var(--bad)';return}
    const r=await SB.from('work_order_source_processes').delete().eq('id',ed.id).select('id');
    if(r.error||!(r.data||[]).length){toast('It could not be removed'+(r.error?': '+r.error.message:'.'),true);return}
    S.procEdit=null;toast('Removed.');await load()},
  savesenders:async()=>{const v=$('colSenders').value;const {data,error}=await SB.rpc('collector_set_senders',{p_senders:v});
    if(error){toast(error.message,true);return}
    if(S.col)S.col.senders=data;toast('Senders saved. It applies from the next check.');render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||!A[el.dataset.a]||el.disabled)return;A[el.dataset.a](el.dataset,el)});
document.addEventListener('change',async e=>{const el=e.target;if(!el.dataset.user||!admin())return;
  const k=el.dataset.k,val=el.value.trim(),u=S.team.find(x=>x.id===el.dataset.user);
  const patch=k==='role'?(val==='manager'?{role:'csr',manager:true,senior:false}:val==='senior'?{role:'tech',manager:false,senior:true}:{role:val,manager:false,senior:false}):{[k]:val};
  const {error}=await SB.from('profiles').update(patch).eq('id',el.dataset.user);
  if(error){toast(error.message,true);if(u)el.value=(k==='role'?roleKey(u):u[k])||'';return}
  if(u)Object.assign(u,patch);if(u&&u.id===S.me.id&&k==='display_name'){S.me.display_name=val;render()}
  toast(k==='role'?`${u&&u.email?u.email:'Account'} is now ${ROLE_NAME[val]}.`:'Name saved.')});
document.addEventListener('submit',async e=>{
  if(e.target.id==='pwform'){e.preventDefault();if(S.pw.busy)return;
    const rec=S.recovery,old=rec?'':$('pwOld').value,nw=$('pwNew').value,nw2=$('pwNew2').value,fail=m=>{S.pw={busy:false,msg:m,ok:false};render()};
    if(nw.length<10)return fail('The new password needs at least 10 characters.');
    if(nw!==nw2)return fail('The two new passwords do not match.');
    if(!rec&&nw===old)return fail('The new password is the same as the current one.');
    S.pw={busy:true,msg:'',ok:false};render();
    if(!rec){
      /* Prove it is really them at the keyboard before changing it. A reset link has already proved it by email. */
      const chk=await SB.auth.signInWithPassword({email:S.me.email||S.session.user.email,password:old});
      if(chk.error)return fail('The current password is not right.');
      S.session=chk.data.session}
    const up=await SB.auth.updateUser({password:nw});
    if(up.error)return fail(up.error.message);
    S.recovery=false;try{history.replaceState(null,'',HERE)}catch(x){}
    S.pw={busy:false,msg:rec?'New password set. Use it next time you sign in.':'Password changed.',ok:true};render();return}
  if(e.target.id!=='login')return;e.preventDefault();
  const msg=$('lgMsg');msg.textContent='Signing in…';
  const {data,error}=await SB.auth.signInWithPassword({email:$('lgEmail').value.trim(),password:$('lgPass').value});
  if(error){msg.textContent=error.message;return}
  S.session=data.session;await whoami();render();if(allowed())load()});
(async function boot(){
  if(!SB){render();return}
  const {data:{session}}=await SB.auth.getSession();S.session=session;
  SB.auth.onAuthStateChange((ev,s)=>{if(s)S.session=s});
  if(RECOVERY_SEEN)S.recovery=true;
  if(session)await whoami();
  render();if(S.session&&allowed())load();
})();
</script>
</body>
</html>
