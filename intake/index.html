<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Appliance — Call Intake</title>
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#f3f4f6;color:#1f2937;font-size:14px}
.header{background:linear-gradient(135deg,#1e40af 0%,#1e3a8a 100%);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header h1{font-size:18px;font-weight:700}
.header .sub{font-size:11px;opacity:.85}
.hright{display:flex;align-items:center;gap:10px}
.feechip{background:#fff;color:#1e3a8a;font-weight:800;padding:6px 14px;border-radius:999px;font-size:15px;min-width:70px;text-align:center}
.feechip small{display:block;font-weight:600;font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px}
select.csr{padding:6px 8px;border-radius:6px;border:none;font-weight:700;font-size:13px;color:#1e3a8a}
.btn{padding:8px 14px;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px}
.btn.ghost{background:rgba(255,255,255,.15);color:#fff}
.wrap{display:grid;grid-template-columns:290px 1fr 300px;gap:14px;padding:14px;max-width:1500px;margin:0 auto;align-items:start}
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.panel.sticky{position:sticky;top:66px;max-height:calc(100vh - 80px);overflow-y:auto}
.psec{padding:14px;border-bottom:1px solid #e5e7eb}
.psec:last-child{border-bottom:none}
.ptitle{font-size:11px;font-weight:800;text-transform:uppercase;color:#6b7280;letter-spacing:.5px;margin-bottom:10px}
.fgrp{margin-bottom:10px}
.fgrp label{display:block;font-size:11px;font-weight:700;color:#374151;margin-bottom:4px}
.fgrp input,.fgrp textarea,.fgrp select{width:100%;padding:8px 10px;border:2px solid #e5e7eb;border-radius:6px;font-size:13px;font-family:inherit}
.fgrp input:focus,.fgrp textarea:focus{outline:none;border-color:#1e40af;box-shadow:0 0 0 3px rgba(30,64,175,.1)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.center h2{font-size:14px;font-weight:800;padding:12px 16px;border-bottom:1px solid #e5e7eb;background:#f9fafb;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:8px}
.center h2 .done{margin-left:auto;font-size:11px;font-weight:700;color:#059669}
.sec{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:14px}
.sbody{padding:14px 16px}
.q{margin-bottom:14px}
.q .qt{font-size:13px;font-weight:700;color:#111827;margin-bottom:6px}
.q .qt .req{color:#dc2626}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:7px 12px;border:2px solid #d1d5db;background:#fff;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;color:#374151;transition:all .12s}
.opt:hover{border-color:#1e40af;background:#eff6ff}
.opt.sel{background:#1e40af;border-color:#1e40af;color:#fff}
.note{background:#fefce8;border-left:4px solid #f59e0b;padding:8px 10px;border-radius:6px;font-size:12px;color:#713f12;margin-top:6px;line-height:1.45}
.note.safety{background:#fef2f2;border-left-color:#dc2626;color:#7f1d1d;font-weight:600}
.note.script{background:#eff6ff;border-left-color:#1e40af;color:#1e3a5f}
.subq{margin:10px 0 2px 14px;padding-left:12px;border-left:3px solid #dbeafe}
textarea.qtext{width:100%;min-height:44px;padding:8px 10px;border:2px solid #e5e7eb;border-radius:6px;font-size:13px;font-family:inherit;resize:vertical}
.checklist{list-style:none}
.checklist li{padding:4px 0;font-size:12px;display:flex;gap:7px;align-items:center;color:#6b7280}
.checklist li.ok{color:#059669;font-weight:600}
.checklist li .dot{width:14px;height:14px;border-radius:50%;border:2px solid #d1d5db;display:inline-block;flex-shrink:0}
.checklist li.ok .dot{background:#059669;border-color:#059669}
.faqq{border-bottom:1px solid #f3f4f6;padding:7px 0;cursor:pointer}
.faqq .fq{font-size:12px;font-weight:700;color:#1e40af}
.faqq .fa{display:none;font-size:12px;color:#4b5563;margin-top:4px;line-height:1.45;white-space:pre-line}
.faqq.open .fa{display:block}
.actions{position:sticky;bottom:0;background:#fff;border-top:2px solid #e5e7eb;padding:12px 16px;display:flex;gap:10px;align-items:center;border-radius:0 0 10px 10px}
.btn.go{background:#059669;color:#fff;flex:1;padding:12px;font-size:14px}
.btn.go:disabled,.btn.go.blocked{background:#d1d5db;color:#6b7280}
.btn.warn{background:#f59e0b;color:#fff}
.btn.plain{background:#e5e7eb;color:#374151}
.missing{font-size:11px;color:#dc2626;font-weight:600}
.reqtag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:#fee2e2;color:#b91c1c;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.qerr{color:#b91c1c;font-size:11px;font-weight:700;margin-top:4px}
.qmiss{outline:3px solid #dc2626;outline-offset:4px;border-radius:6px;background:#fef2f2}
.fgrp.qmiss input,select.qmiss{border-color:#dc2626}
#noteModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px}
#noteModal.show{display:flex}
.modal{background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:85vh;display:flex;flex-direction:column}
.modal h3{padding:14px 18px;border-bottom:1px solid #e5e7eb;font-size:15px}
.modal pre{flex:1;overflow:auto;padding:16px 18px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;font-family:Menlo,Consolas,monospace;background:#f9fafb}
.modal .mfoot{padding:12px 18px;border-top:1px solid #e5e7eb;display:flex;gap:10px}
.copied{color:#059669;font-weight:700;font-size:12px;align-self:center}
.banner{background:#dc2626;color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;font-size:13px;margin-bottom:12px;display:none}
.banner.show{display:block}
@media(max-width:1100px){.wrap{grid-template-columns:1fr}.panel.sticky{position:static;max-height:none}}

/* Phase 2 */
#login{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#login[hidden]{display:none}
#login form{background:#fff;border-radius:12px;padding:24px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#login h2{font-size:20px;color:#1e3a8a}
#login label{font-size:12px;font-weight:700;color:#374151;display:flex;flex-direction:column;gap:4px}
#login input{font:inherit;padding:10px;border:2px solid #e5e7eb;border-radius:6px}
#login button{background:#1e40af;color:#fff;border:0;border-radius:6px;padding:11px;font-weight:700;font-size:14px;cursor:pointer}
#loginMsg{font-size:12px;color:#b91c1c;min-height:16px}
#loginMsg.ok{color:#047857}
#login button[disabled]{opacity:.6;cursor:default}
#login .alt{font-size:12px;color:#6b7280;text-align:center}
.whoami{font-size:13px;font-weight:700;display:none}
body.online .whoami,body.online #signOut{display:inline-block}
body.online select.csr{display:none}
#signOut{display:none}
.hchip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.2);display:none}
body.online .hchip{display:inline-block}
.hchip.ok{background:#059669}.hchip.bad{background:#dc2626}
.hsearch{width:100%;padding:8px 10px;border:2px solid #e5e7eb;border-radius:6px;font-size:13px;font-family:inherit}
.hlist{max-height:240px;overflow-y:scroll;border:1px solid #cbd5e1;border-radius:8px;padding:0 8px 8px;margin-top:6px;background:#f8fafc}
.hlist::-webkit-scrollbar{width:10px}.hlist::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:6px}.hlist::-webkit-scrollbar-track{background:#e2e8f0;border-radius:6px}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:6px}
.hlink{background:none;border:none;color:#1e40af;font-weight:700;font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
.hcard{border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;margin-top:8px}
.hcard.sel{border-color:#1e40af;background:#eff6ff}
.hcard .opt{margin-top:6px}
.hn{font-weight:800;font-size:13px}
.hm{font-size:11.5px;color:#4b5563;line-height:1.4}
.hsub{font-size:10px;font-weight:800;text-transform:uppercase;color:#6b7280;margin:10px 0 4px;letter-spacing:.4px}
.hradio{display:flex;gap:6px;font-size:12px;align-items:flex-start;margin:3px 0;cursor:pointer}
.hjob{font-size:12px;padding:5px 0;border-top:1px solid #e5e7eb}
.hdays{font-size:10px;font-weight:800;background:#e5e7eb;border-radius:999px;padding:1px 6px}
.hdays.warm{background:#fde68a;color:#78350f}
.hmsg{font-size:12.5px;font-weight:600;padding:0 18px 12px;min-height:4px}
.hmsg.ok{color:#047857}.hmsg.bad{color:#b91c1c}
.btn.hcp{background:#1e40af;color:#fff}
.savedbig{background:#059669;color:#fff;border-radius:10px;padding:16px 18px;margin-bottom:14px;font-size:18px;font-weight:800;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(5,150,105,.35)}
.savedbig[hidden]{display:none}
.savedbig a{color:#fff;background:rgba(255,255,255,.2);padding:6px 12px;border-radius:6px;font-size:14px;text-decoration:none}
.savedbig small{display:block;font-size:12px;font-weight:600;opacity:.9}
.hmsg.ok{font-size:16px;font-weight:800;background:#ecfdf5;border-top:2px solid #059669;padding:12px 18px}
.hmsg.bad{background:#fef2f2;border-top:2px solid #dc2626;padding:12px 18px}
.btn.hcp:disabled{background:#d1d5db;color:#6b7280}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
</head>
