<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!-- Sign-in screen only. The Call Desk content is loaded from the database after a staff sign-in. -->
<title>Call Desk</title>
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>

/* Layout: a counter desk. Work-order strip on top, three instant lookups in a row,
   then the ask box with answers stacked newest-first, then the list of open questions for Jake. */
:root{
  --bg:#f1f4f5; --surface:#ffffff; --field:#f8fafb; --ink:#13242c; --ink2:#4a5d66; --line:#d2dce0;
  --accent:#0a6b8a; --accent-ink:#ffffff;
  --book:#1b7647; --book-bg:#e1f2e8;
  --heads:#9a5800; --heads-bg:#fbeed6;
  --ask:#aa2f47; --ask-bg:#f8e2e6;
  --info:#32566a; --info-bg:#e3edf1;
  --accent-bg:rgba(10,107,138,.10); --accent-soft:#2b8aa8; --field2:#eef2f4; --line2:#b4c3c9; --ink3:#6b7e87;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'Barlow Condensed','Barlow',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a20; --surface:#15252d; --field:#10202a; --ink:#e5eef1; --ink2:#9cb0b9; --line:#28404b;
    --accent:#56b6d4; --accent-ink:#062530;
    --book:#63d29b; --book-bg:#12372a;
    --heads:#f2b65c; --heads-bg:#3a2b0f;
    --ask:#f28ca0; --ask-bg:#41202a;
    --info:#9cc5d6; --info-bg:#183341;
    --accent-bg:rgba(86,182,212,.14); --accent-soft:#8fd0e6; --field2:#1b303a; --line2:#3a5663; --ink3:#78909b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a20; --surface:#15252d; --field:#10202a; --ink:#e5eef1; --ink2:#9cb0b9; --line:#28404b;
  --accent:#56b6d4; --accent-ink:#062530;
  --book:#63d29b; --book-bg:#12372a;
  --heads:#f2b65c; --heads-bg:#3a2b0f;
  --ask:#f28ca0; --ask-bg:#41202a;
  --info:#9cc5d6; --info-bg:#183341;
  --accent-bg:rgba(86,182,212,.14); --accent-soft:#8fd0e6; --field2:#1b303a; --line2:#3a5663; --ink3:#78909b;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 56px}
.shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:2px solid var(--ink);margin-inline:-16px;padding-inline:16px}
.shell-in{max-width:1120px;margin-inline:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:4px 24px;flex-wrap:wrap;padding-top:10px}
.mark{font-family:var(--f-head);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1;padding-bottom:8px;white-space:nowrap}
.mark span{color:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:thin}
.tab-btn{background:transparent;border:0;border-bottom:4px solid transparent;color:var(--ink2);font-family:var(--f-head);font-weight:600;font-size:18px;letter-spacing:.05em;text-transform:uppercase;padding:8px 14px 6px;white-space:nowrap;margin-bottom:-2px}
.tab-btn[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab-btn:hover{color:var(--ink)}
.tab-btn:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
@media (max-width:560px){.tabs{flex-wrap:wrap;overflow:visible}.tab-btn{font-size:16px;padding:6px 10px 4px}.mark{padding-bottom:2px}.shell-in{flex-direction:column;align-items:flex-start}}
.badge{display:inline-block;min-width:20px;text-align:center;font-family:var(--f-mono);font-size:12px;background:var(--ask);color:var(--bg);border-radius:10px;padding:1px 6px;margin-left:6px;vertical-align:2px}
main{max-width:1120px;margin-inline:auto;padding-top:18px}
.tab[hidden]{display:none}
.tool{--surface2:var(--field);--surface3:var(--field2);--border:var(--line);--border2:var(--line2);--accent2:var(--accent-soft);--glow:var(--accent-bg);--text:var(--ink);--text2:var(--ink2);--text3:var(--ink3);--green:var(--book);--green-bg:var(--book-bg);--amber:var(--heads);--amber-bg:var(--heads-bg);--red:var(--ask);--red-bg:var(--ask-bg);--z1:var(--book);--z1bg:var(--book-bg);--z2:var(--accent);--z2bg:var(--accent-bg);--z3:var(--heads);--z3bg:var(--heads-bg);--z4:var(--ask);--z4bg:var(--ask-bg);font-family:var(--f-body);color:var(--ink);min-width:0}
.tool .wrap{margin-inline:auto}
.tool button,.tool input,.tool select,.tool textarea{font-family:inherit}
.link-btn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:13.5px;text-align:left}
.ask-line{font-size:13.5px;color:var(--ink2);margin-bottom:14px}
.cd .wrap{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
.tool select.field-select,.tool .field-input,.tool .q-textarea{max-width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-size:15px;max-width:min(92vw,520px);z-index:9}
.dm-note{font-size:13px;color:var(--ink2);margin-bottom:10px}

/* ---- desk ---- */
.cd *{box-sizing:border-box}
.cd .wrap{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
.cd .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:10px}
.cd .top h1{font-family:var(--f-head);font-weight:700;font-size:34px;letter-spacing:.01em;line-height:1;margin:0;text-transform:uppercase}
.cd .top p{margin:4px 0 0;color:var(--ink2);font-size:15px}
.cd .stamp{font-family:var(--f-mono);font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.cd h2{font-family:var(--f-head);font-weight:600;font-size:20px;letter-spacing:.04em;text-transform:uppercase;margin:0}
.cd .sub{color:var(--ink2);font-size:14px;margin:2px 0 0}
.cd .row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.cd .card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 14px 16px;min-width:0;
  display:flex;flex-direction:column;gap:10px}
.cd label.lbl{font-family:var(--f-head);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.cd input[type=text],.cd textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);
  border-radius:4px;padding:10px 11px;min-width:0}
.cd input[type=text]{font-family:var(--f-mono);font-size:17px;font-weight:500}
.cd textarea{resize:vertical;min-height:84px;font-size:16px}
.cd input:focus-visible,.cd textarea:focus-visible,.cd button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.cd button{font:inherit;cursor:pointer}
.cd .btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:9px 16px;font-weight:600;
  font-family:var(--f-head);font-size:17px;letter-spacing:.05em;text-transform:uppercase}
.cd .btn[disabled]{opacity:.55;cursor:default}
.cd .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:6px 11px;font-size:15px}
.cd .btn.small{padding:5px 10px;font-size:14px}
.cd .res{display:flex;flex-direction:column;gap:8px;min-height:20px}
.cd .fee{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cd .fee b{font-family:var(--f-mono);font-size:38px;line-height:1;font-weight:600}
.cd .fee span{color:var(--ink2);font-size:14px}
.cd .chip{display:inline-block;font-family:var(--f-head);font-weight:700;font-size:15px;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 9px;border-radius:3px;white-space:nowrap}
.cd .chip.book{background:var(--book-bg);color:var(--book)}
.cd .chip.heads_up{background:var(--heads-bg);color:var(--heads)}
.cd .chip.hold{background:var(--ask-bg);color:var(--ask)}
.cd .chip.info{background:var(--info-bg);color:var(--info)}
.cd .note{border-left:4px solid var(--line);padding:6px 10px;font-size:14.5px;background:var(--field);border-radius:0 4px 4px 0}
.cd .note.warn{border-left-color:var(--heads);background:var(--heads-bg)}
.cd .note.stop{border-left-color:var(--ask);background:var(--ask-bg)}
.cd .note.ok{border-left-color:var(--book);background:var(--book-bg)}
.cd .note b{font-weight:600}
.cd .tag{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);
  border:1px solid var(--line);border-radius:3px;padding:1px 6px;align-self:flex-start}
.cd .mean{margin:0;font-size:15px}
.cd .mean q{quotes:none;font-weight:600}
.cd ul.tight{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.cd .ask-box{display:flex;flex-direction:column;gap:10px}
.cd .ask-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cd .chips{display:flex;gap:8px;flex-wrap:wrap}
.cd .eg{background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:14px}
.cd .eg:hover{border-color:var(--accent)}
.cd .thread{display:flex;flex-direction:column;gap:12px}
.cd .ans{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cd .ans.book{border-top:5px solid var(--book)}
.cd .ans.heads_up{border-top:5px solid var(--heads)}
.cd .ans.hold{border-top:5px solid var(--ask)}
.cd .ans.info{border-top:5px solid var(--info)}
.cd .q{font-size:14px;color:var(--ink2)}
.cd .q b{color:var(--ink);font-weight:600}
.cd .headline{font-size:20px;font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
.cd .say{background:var(--field);border:1px dashed var(--line);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cd .say .t{font-size:16px;font-style:normal}
.cd .say .k{font-family:var(--f-head);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.cd .heard{width:100%;border-collapse:collapse;font-size:15px}
.cd .heard td{padding:4px 8px 4px 0;vertical-align:top;border-top:1px solid var(--line)}
.cd .heard td:first-child{font-weight:600;white-space:nowrap;padding-right:14px}
.cd .table-wrap{overflow-x:auto}
.cd .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cd .small-note{font-size:13.5px;color:var(--ink2)}
.cd .asks{display:flex;flex-direction:column;gap:8px}
.cd .ask-row{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cd .ask-row .meta{font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
.cd .ask-row .a{border-left:4px solid var(--book);padding-left:10px}
.cd .inline{display:flex;gap:8px;flex-wrap:wrap}
.cd .inline input{flex:1 1 220px;font-family:var(--f-body);font-size:16px}
.cd .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:4px;font-size:15px;max-width:min(92vw,520px);z-index:9}
.cd .dots::after{content:'';display:inline-block;width:1.2em;text-align:left;animation:d 1.2s steps(4,end) infinite}
@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
@media (prefers-reduced-motion:reduce){.cd .dots::after{animation:none;content:'...'}}
@media (max-width:480px){.cd .top h1{font-size:30px}
.cd .fee b{font-size:34px}}
/* ---- intake ---- */
#tool-intake 500&family=DM+Sans:wght@300;400;500;600&display=swap');
*,#tool-intake *::before,#tool-intake *::after{box-sizing:border-box;margin:0;padding:0}
#tool-intake .header{max-width:820px;margin:0 auto 24px;display:flex;align-items:center;gap:14px;}
#tool-intake .hicon{width:46px;height:46px;background:var(--glow);border:1px solid var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;}
#tool-intake .htitle{font-size:20px;font-weight:600;letter-spacing:-0.3px;}
#tool-intake .hsub{font-size:12px;color:var(--text2);margin-top:3px;}
#tool-intake .wrap{max-width:820px;margin:0 auto;}
#tool-intake .progress-bar{display:flex;align-items:center;gap:6px;margin-bottom:20px;}
#tool-intake .prog-step{height:4px;flex:1;border-radius:99px;background:var(--border);transition:background .3s;}
#tool-intake .prog-step.done{background:var(--green);}
#tool-intake .prog-step.active{background:var(--accent);}
#tool-intake .prog-label{font-family:var(--f-mono);font-size:10px;color:var(--text3);margin-left:4px;white-space:nowrap;}
#tool-intake .section-lbl{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);margin-bottom:10px;}
#tool-intake .app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:8px;}
@media(max-width:560px){#tool-intake .app-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:380px){#tool-intake .app-grid{grid-template-columns:repeat(2,1fr);}}
#tool-intake .app-btn{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 8px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .15s;}
#tool-intake .app-btn:hover{border-color:var(--accent);background:var(--surface2);transform:translateY(-1px);}
#tool-intake .app-btn.active{border-color:var(--accent);background:var(--glow);box-shadow:0 0 0 1px var(--accent);}
#tool-intake .app-btn .icon{font-size:22px;}
#tool-intake .app-btn .name{font-size:11px;font-weight:500;color:var(--text);line-height:1.3;}
#tool-intake .univ-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
@media(max-width:520px){#tool-intake .univ-grid{grid-template-columns:1fr;}}
#tool-intake .field-group{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px 14px;}
#tool-intake .field-label{font-size:11px;font-weight:500;color:var(--text2);margin-bottom:7px;display:flex;align-items:center;gap:6px;}
#tool-intake .field-label .req{color:var(--red);font-size:10px;}
#tool-intake .field-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-size:13px;color:var(--text);font-family:var(--f-body);outline:none;transition:border-color .15s;}
#tool-intake .field-input:focus{border-color:var(--accent);}
#tool-intake .field-select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-size:13px;color:var(--text);font-family:var(--f-body);outline:none;cursor:pointer;}
#tool-intake .field-select:focus{border-color:var(--accent);}
#tool-intake .radio-row{display:flex;gap:8px;flex-wrap:wrap;}
#tool-intake .radio-btn{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:7px 12px;cursor:pointer;font-size:12px;font-weight:500;color:var(--text2);transition:all .14s;}
#tool-intake .radio-btn:hover{border-color:var(--accent2);color:var(--text);}
#tool-intake .radio-btn.active{border-color:var(--accent);background:var(--glow);color:var(--accent2);}
#tool-intake .symptom-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px;}
@media(max-width:480px){#tool-intake .symptom-grid{grid-template-columns:1fr;}}
#tool-intake .sym-btn{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px 13px;cursor:pointer;text-align:left;font-size:12px;font-weight:500;color:var(--text);transition:all .14s;line-height:1.4;}
#tool-intake .sym-btn:hover{border-color:var(--accent);background:var(--surface2);}
#tool-intake .sym-btn.active{border-color:var(--accent);background:var(--glow);color:var(--accent2);}
#tool-intake .sym-btn .sym-icon{font-size:14px;margin-right:6px;}
#tool-intake .q-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px;animation:fadeUp .18s ease;}
#tool-intake .q-head{padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;font-weight:500;color:var(--text2);}
#tool-intake .q-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
#tool-intake .q-item{}
#tool-intake .q-text{font-size:13px;font-weight:500;color:var(--text);margin-bottom:7px;line-height:1.45;}
#tool-intake .q-sub{font-size:11px;color:var(--text3);margin-bottom:7px;margin-top:-4px;}
#tool-intake .q-options{display:flex;gap:6px;flex-wrap:wrap;}
#tool-intake .q-opt{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 11px;cursor:pointer;font-size:12px;color:var(--text2);transition:all .13s;}
#tool-intake .q-opt:hover{border-color:var(--accent2);color:var(--text);}
#tool-intake .q-opt.active{border-color:var(--accent);background:var(--glow);color:var(--accent2);}
#tool-intake .q-textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:9px 11px;font-size:12px;color:var(--text);font-family:var(--f-body);outline:none;resize:vertical;min-height:64px;transition:border-color .15s;}
#tool-intake .q-textarea:focus{border-color:var(--accent);}
#tool-intake .alert{border-radius:10px;padding:13px 15px;margin-bottom:12px;display:flex;gap:10px;line-height:1.5;animation:fadeUp .18s ease;}
#tool-intake .alert-icon{font-size:16px;flex-shrink:0;margin-top:1px;}
#tool-intake .alert-body{}
#tool-intake .alert-title{font-size:13px;font-weight:600;margin-bottom:4px;}
#tool-intake .alert-text{font-size:12px;}
#tool-intake .alert-script{font-size:12px;font-style:italic;margin-top:6px;padding:8px 10px;border-radius:6px;background:rgba(0,0,0,0.2);}
#tool-intake .alert-red{background:var(--red-bg);border:1px solid var(--red-border);}
#tool-intake .alert-red .alert-title,#tool-intake .alert-red .alert-text,#tool-intake .alert-red .alert-script{color:var(--red);}
#tool-intake .alert-amber{background:var(--amber-bg);border:1px solid var(--amber-border);}
#tool-intake .alert-amber .alert-title,#tool-intake .alert-amber .alert-text,#tool-intake .alert-amber .alert-script{color:var(--amber);}
#tool-intake .alert-green{background:var(--green-bg);border:1px solid var(--green-border);}
#tool-intake .alert-green .alert-title,#tool-intake .alert-green .alert-text,#tool-intake .alert-green .alert-script{color:var(--green);}
#tool-intake .alert-blue{background:var(--glow);border:1px solid rgba(79,124,255,0.25);}
#tool-intake .alert-blue .alert-title,#tool-intake .alert-blue .alert-text,#tool-intake .alert-blue .alert-script{color:var(--accent2);}
#tool-intake .alert-purple{background:var(--purple-bg);border:1px solid var(--purple-border);}
#tool-intake .alert-purple .alert-title,#tool-intake .alert-purple .alert-text,#tool-intake .alert-purple .alert-script{color:var(--purple);}
#tool-intake .output-panel{background:var(--surface);border:1px solid var(--green-border);border-radius:12px;overflow:hidden;animation:fadeUp .2s ease;}

(async function(){
  const CFG=window.COACH_CONFIG||{},gate=document.getElementById('login'),form=document.getElementById('loginForm'),msg=document.getElementById('loginMsg');
  const say=t=>{msg.textContent=t},lock=on=>form.querySelectorAll('input,button').forEach(e=>{e.disabled=on});

  async function open(){
    lock(true);say('Opening the Call Desk\u2026');

    if(error){lock(false);say('Could not load the Call Desk. Check your connection and try again.');return}
    if(!data||!data.html){
      form.innerHTML='<h1>Call <span>Desk</span></h1><div style="font-size:14px;color:var(--ink2)">This account does not have access to the Call Desk. Ask Jake to set your role.</div><button type="button" id="gateOut">Sign out</button>';
      document.getElementById('gateOut').addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});return}
    window.__deskSB=sb;
    const t=document.createElement('template');t.innerHTML=data.html;
    gate.remove();
    const scripts=Array.from(t.content.querySelectorAll('script'));
    document.body.appendChild(t.content);
    /* Scripts that arrive as text do not run by themselves; run each one in order, now that the markup is in place. */
    for(const s of scripts){const n=document.createElement('script');n.textContent=s.textContent;s.replaceWith(n)}
  }
  form.addEventListener('submit',async e=>{e.preventDefault();say('Signing in\u2026');
    const {error}=await sb.auth.signInWithPassword({email:document.getElementById('lgEmail').value.trim(),password:document.getElementById('lgPass').value});
    if(error){say(error.message==='Invalid login credentials'?'Wrong email or password.':error.message);return}
    open()});
  const {data:{session}}=await sb.auth.getSession();
  if(session)open();else document.getElementById('lgEmail').focus();
})();
</script>

</body></html>
